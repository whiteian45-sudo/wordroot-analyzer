/* 相关词汇区：近反义词 + 同源同根词 两栏并排（挂两边） */
function relBlock(word, cog) {
  const cols = [synAntBlock(word), cogBlockHTML(word, cog)].filter(Boolean);
  if (!cols.length) return '';
  return `<div class="rel-wrap">` + cols.map(c => `<div class="rel-col">${c}</div>`).join('') + `</div>`;
}

/* oxford 中文释义兜底：def_zh 为空（交叉引用条目，如 polygraph = lie detector）
   或过短疑似主题标签（如 encrypt→"计算机"）时，用全量词典释义互补显示 */
function oxDefZh(o, w) {
  const z = o.def_zh || '';
  const ec = ECDICT[w] && nl(ECDICT[w].t);
  if (!ec) return z;
  const zl = z.replace(/\s/g, '').length;
  return (zl <= 6 && ec.replace(/\s/g, '').length > zl) ? ec : z;
}
/* 牛津交叉引用区块：txt 是原文字（如 "lie detector"、"past tense of arise"），
   hits 是可跳转目标。单目标直接跳；多目标时文字不含逗号（"dead on arrival" 被拆成三段）
   则整串按短语跳，含逗号的（ageing, ageism）不做成链接，避免跳到不存在的词 */
function xrBlock(xr) {
  if (!xr || (!xr.txt && !(xr.hits || []).length)) return '';
  const hits = xr.hits || [];
  let t = '';
  if (hits.length === 1) t = hits[0];
  else if (hits.length > 1 && !/[,;]/.test(xr.txt || '')) t = String(xr.txt || '').trim();
  if (t) t = t.replace(/\s*\([^)]*\)\s*$/, '').trim();   // 去掉牛津义项标记（AS (level)、adventurous (1)）
  const body = escapeHtml(xr.txt || hits.join(', '));
  return `<div class="meaning"><div class="label">参见</div><div class="xr-line">` +
    `<span class="xr-lab">${escapeHtml(xr.lab || '=')}</span>` +
    (t ? `<span class="cog xr-word" data-w="${escapeHtml(t)}">${body}</span>` : body) +
    `</div></div>`;
}
/* 生成完整卡片 HTML（单查词 render 与右侧面板共用） */
/* 💡 AI 助记：把「单词 + 词根拆解 + 释义」交给本地 Ollama（server.py /memo 代理）编一句记忆口诀。
   数据塞进 data-* 由全局委托读取，卡片各分支不用各写一遍。 */
function memoMorphText(r) {
  // 含义中英都给：模型被要求用另一种语言输出时，双语输入能让它理解得更准
  const dual = (mm, zh) => {
    const en = MORPH_EN[mm];
    if (zh && en && en !== zh) return zh + '/' + en;
    return zh || en || '';
  };
  if (r.enhanced && r.enhanced.chain && r.enhanced.chain.length) {
    const p = r.enhanced.chain.filter(m => m.m && m.meaning).map(m => m.m + '(' + dual(m.m, m.meaning) + ')');
    if (p.length) return p.join(' + ');
  }
  let b = r.breakdown;
  if (!b) {
    const head = r.headword || r.word;
    b = decompose(head, 0) || partialDecompose(head);
    // 有未识别片段的别拿去让模型编——它会把 "??" 当词根硬圆
    if (b && (b.unknown || !b.roots || !b.roots.length)) b = null;
  }
  if (!b) return '';
  const p = [];
  if (b.prefix) p.push(b.prefix.m + '-(' + dual(b.prefix.m, prefMeaning(b.prefix, b.roots[0] && b.roots[0].m)) + ')');
  (b.roots || []).forEach(x => p.push(x.m + '(' + dual(x.m, x.meaning) + ')'));
  (b.suffixes || []).forEach(x => p.push('-' + x.m + '(' + dual(x.m, x.meaning) + ')'));
  return p.join(' + ');
}
function memoMeaning(r) {
  if (r.enhanced && r.enhanced.meaning) return r.enhanced.meaning.replace(/\\n/g, '；');
  if (r.oxford && r.oxford.def_zh) return r.oxford.def_zh;
  const ec = r.ecdict || ECDICT[r.word];
  if (ec && ec.t) return ec.t.replace(/\\r?\\n/g, '；').slice(0, 80);
  return '';
}
/* 助记缓存：localStorage 按「词 + 语言」存一条（中文界面存的是英文助记、英文界面相反，
   不带语言会串）。清站点数据会丢，但助记可再生（再点一次 1-2 秒），不值得上服务端。 */
const MEMO_KEY = 'wr_memo';
function loadMemos() {
  try { return JSON.parse(localStorage.getItem(MEMO_KEY)) || {}; } catch (e) { return {}; }
}
function memoCacheKey(w, lang) { return String(w).toLowerCase() + '|' + lang; }
function saveMemo(w, lang, text) {
  const m = loadMemos();
  m[memoCacheKey(w, lang)] = { t: text, l: lang, ts: Date.now() };
  const ks = Object.keys(m);
  if (ks.length > 800) {   // 上限：超了按时间戳删最旧的一批，防无限增长
    ks.sort((a, b) => (m[a].ts || 0) - (m[b].ts || 0)).slice(0, ks.length - 800).forEach(k => delete m[k]);
  }
  try { localStorage.setItem(MEMO_KEY, JSON.stringify(m)); } catch (e) {}
}
/* 助记文本上屏：英文助记里的词切成可点 token（复用段落模式的 .ptok，
   点击由 #result 的委托统一转给右侧面板，这里不用再绑事件）。
   中文助记直接转义输出——中文没有拆解需求。 */
function memoTextHTML(text, lang) {
  if (lang !== 'en') return escapeHtml(text);
  return String(text).split(/(\s+)/).map(tok => {
    if (!/^[A-Za-z']+$/.test(tok)) return escapeHtml(tok);
    const key = tok.toLowerCase().replace(/[^a-z]/g, '');
    if (!key || !noteHasValue(analyze(key), key)) return escapeHtml(tok);
    return `<span class="ptok" data-w="${escapeHtml(tok)}">${escapeHtml(tok)}</span>`;
  }).join('');
}

function memoBlockHTML(r) {
  if (r.reason) return '';                    // 「查不到」的卡片不挂助记
  const morph = memoMorphText(r);
  if (!morph) return '';
  const q = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const lang = EN_MODE() ? 'zh' : 'en';       // 助记语言与界面相反
  const cached = loadMemos()[memoCacheKey(r.word, lang)];
  return `<div class="meaning memo-wrap"><button class="memo-btn" data-memo="${q(r.word)}"` +
    ` data-morph="${q(morph)}" data-meaning="${q(memoMeaning(r))}"` +
    ` title="按词根编一句话助记（中文界面出英文、英文界面出中文）">` +
    (cached ? '💡 重新生成' : '💡 AI 助记') + `</button>` +
    `<div class="memo-box"${cached ? '' : ' hidden'}>${cached ? memoTextHTML(cached.t, cached.l) : ''}</div></div>`;
}

function cardHTML(r) {
  let html = '';

  if (r.found && r.source === 'enhanced') {
    const e = r.enhanced;
    const viaRedir = r.query && normKey(r.query) !== r.word;
    html += `<div class="card">
      <div class="word-line">
        <span class="word">${r.word}</span>${viaRedir ? `<span class="badge redir">← ${escapeHtml(r.query)}</span>` : ''}<span class="badge enhanced">增强词表</span>
        <button class="tts-btn" data-w="${r.word}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">${isFav(r.word) ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>`;
    if (e.pron) html += `<div class="meaning"><div class="label">音标</div>${ipaNorm(e.pron)}</div>`;
    // 释义：英文模式优先取牛津 def_en / 全量词典 d（数据层本身就有英文）
    if (EN_MODE()) {
      const ox = oxfordLookup(r.word);
      const enDef = (ox && ox.o && ox.o.def_en) || (ECDICT[r.word] && ECDICT[r.word].d) || '';
      if (enDef) html += `<div class="meaning"><div class="label">释义</div>${escapeHtml(enDef).replace(/\n/g, '<br>')}</div>`;
    } else if (e.meaning) {
      html += `<div class="meaning"><div class="label">释义</div>${e.meaning}</div>`;
    }
    if (e.chain && e.chain.length) {
      // chain 是结构化词素 → 渲染三色块（中英模式都走 gl()，不再拼中文 breakdown 串）
      const blk = enhancedMorphBlock(e.chain);
      html += blk || (e.breakdown ? `<div class="meaning"><div class="label">词根词缀分解</div>${dp(e.breakdown)}</div>` : '');
    } else if (e.breakdown) {
      html += `<div class="meaning"><div class="label">词根词缀分解</div>${dp(e.breakdown)}</div>`;
    } else {
      // 数据缺 breakdown（theocracy 等）：跑引擎兜底，质量达标才显示，否则保持空白
      html += enhancedMorphFallback(r.word);
    }
    if (e.chain && e.chain.length) {
      html += `<div class="meaning"><div class="label">词源演变链</div><div class="chain">`;
      e.chain.forEach((m, idx) => {
        const mm = dp(gl(m.m, m.meaning));
        if (m.source && m.source.lang) {
          const note = (!EN_MODE() && m.source.note && m.source.note !== m.meaning) ? `<span class="note">（${m.source.note}）</span>` : '';
          html += `<div class="chain-item" style="--i:${idx}"><span class="chain-morph">${m.m}</span>` +
            `<span class="chain-arrow">←</span>` +
            `<span class="chain-src"><span class="lang">${langEn(m.source.lang)}</span><span class="w">${m.source.word}</span>${note}</span>` +
            `<span class="chain-meaning">${mm ? '（' + mm + '）' : ''}</span></div>`;
        } else {
          html += `<div class="chain-item" style="--i:${idx}"><span class="chain-morph">${m.m}</span>` +
            `<span class="chain-nosrc">${mm || ''}</span></div>`;
        }
      });
      html += `</div></div>`;
    }
    if (EN_MODE()) {
      if (ETYM[r.word]) html += `<div class="meaning"><div class="label">词源</div>${escapeHtml(ETYM[r.word])}</div>`;
    } else if (e.etymology) {
      html += `<div class="meaning"><div class="label">词源</div>${e.etymology}</div>`;
    }
    html += examplesBlock(r.word, e.examples);
    html += (lastRel = relBlock(r.word, findCognates(r.word)));
    html += `</div>`;
  } else if (r.source === 'oxford') {
    const o = r.oxford;
    const hw = r.headword || r.word;
    const viaRedir = hw !== r.word || (r.query && normKey(r.query) !== r.word);
    const redirSrc = hw !== r.word ? r.word : (r.query || '');
    html += `<div class="card">
      <div class="word-line">
        <span class="word">${escapeHtml(hw)}</span>${viaRedir ? `<span class="badge redir">← ${escapeHtml(redirSrc)}</span>` : ''}<span class="badge">牛津9</span>
        <button class="tts-btn" data-w="${escapeHtml(hw)}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">${isFav(r.word) ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>`;
    const prons = [];
    if (o.bre) prons.push(`BrE /${fixIpaSeg(o.bre)}/`);
    if (o.name) prons.push(`NAmE /${fixIpaSeg(o.name)}/`);
    if (prons.length) html += `<div class="meaning"><div class="label">音标</div>${prons.join(' · ')}</div>`;
    if (o.pos) html += `<div class="meaning"><div class="label">词性</div>${escapeHtml(o.pos)}</div>`;
    // 中文释义：def_zh 为空（牛津交叉引用条目，如 polygraph = lie detector）
    // 或过短疑似主题标签（如 encrypt→"计算机"）时，用全量词典释义兜底
    // 英文模式下 def_en 已经给出释义，这块中文不再重复显示（与 ecdict 分支同口径：
    // 有英文用英文，没有才回落中文，卡片不至于空着）
    let defZh = oxDefZh(o, r.word);
    // 走 ecdict 兜底时可能是多行释义（oxDefZh 返回的是 nl() 过的真实换行），
    // 不转 <br> 的话几行会挤成一行——对比 ecdict 卡片那条路径。
    if (defZh && !(EN_MODE() && o.def_en)) html += `<div class="meaning"><div class="label">释义</div>${escapeHtml(defZh).replace(/\n/g, '<br>')}</div>`;
    if (o.xr) html += xrBlock(o.xr);
    if (o.def_en) {
      html += `<div class="meaning"><div class="label">英文释义</div><div class="ex-en def-line"><span class="ex-en-txt">${escapeHtml(o.def_en)}</span>` +
        `<button class="tts-btn ex-tts" data-text="${escapeHtml(o.def_en).replace(/"/g, '&quot;')}" title="朗读这条释义">🔊</button></div></div>`;
    }
    html += morphBlockHTML(hw, decompose(hw, 0) || partialDecompose(hw));
    if (ETYM[r.word]) html += `<div class="meaning"><div class="label">词源(Etymonline)</div><div class="etym">${escapeHtml(ETYM[r.word])}</div></div>`;
    html += examplesBlock(hw, o.examples);
    html += (lastRel = relBlock(hw, findCognates(hw)));
    html += `</div>`;
  } else if (r.source === 'ecdict') {
    const d = r.ecdict;
    html += `<div class="card">
      <div class="word-line">
        <span class="word">${r.word}</span>
        <span class="badge">全量词典</span>
        <button class="tts-btn" data-w="${r.word}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">${isFav(r.word) ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>`;
    if (d.p) html += `<div class="meaning"><div class="label">音标</div>${ipa(d.p)}</div>`;
    if (d.g) html += `<div class="meaning"><div class="label">词性</div>${d.g}</div>`;
    // 英文模式优先用 ECDICT 的英文释义 d（覆盖 21%）；没有则回落到中文
    const _t = EN_MODE() ? (nl(d.d) || '') : nl(d.t);
    if (_t) html += `<div class="meaning"><div class="label">释义</div>${escapeHtml(_t).replace(/\n/g, '<br>')}</div>`;
    else if (d.t && EN_MODE()) html += `<div class="meaning"><div class="label">释义</div>${nl(d.t).replace(/\n/g, '<br>')}</div>`;
    if (d.d) {
      html += `<div class="meaning"><div class="label">英文释义</div>`;
      nl(d.d).split('\n').map(s => s.trim()).filter(Boolean).forEach(ln => {
        html += `<div class="ex-en def-line"><span class="ex-en-txt">${ln}</span>` +
          `<button class="tts-btn ex-tts" data-text="${escapeHtml(ln).replace(/"/g, '&quot;')}" title="朗读这条释义">🔊</button></div>`;
      });
      html += `</div>`;
    }
    // 全量词：先拆解（完整优先，失败退回部分拆解，如 binary→bi-+??nary），
    // 再据此生成分解区块与词源演变链（渲染逻辑与 enhanced 兜底共用 morphBlockHTML）
    html += morphBlockHTML(r.word, decompose(r.word, 0) || partialDecompose(r.word));
    if (ETYM[r.word]) html += `<div class="meaning"><div class="label">词源(Etymonline)</div><div class="etym">${escapeHtml(ETYM[r.word])}</div></div>`;
    html += (lastRel = relBlock(r.word, findCognates(r.word)));
    html += examplesBlock(r.word, null);
    html += `</div>`;
  } else if (r.found) {
    const b = r.breakdown;
    const chunks = bdToChunks(b);

    html += `<div class="card">
      <div class="word-line">
        <span class="word">${r.word}</span>
        <span class="badge">词根拆解</span>
        <button class="tts-btn" data-w="${r.word}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">${isFav(r.word) ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>`;
    if (r.suggestion && r.suggestion !== r.word) {
      html += `<div class="spell-suggest">疑似拼写错误？你想查的是 <span class="cog" data-w="${r.suggestion}">${r.suggestion}</span> 吗？（点击跳转）</div>`;
    }
    html += morphChunksHTML(chunks);

    // 构成逻辑
    const eq = [];
    if (b.prefix) eq.push(b.prefix.m + '(' + prefMeaning(b.prefix, b.roots[0] && b.roots[0].m).split(';').join('/') + ')');
    b.roots.forEach(r => eq.push(r.m + '(' + gl(r.m, r.meaning) + ')'));
    if (b.suffixes) b.suffixes.forEach(s => eq.push(s.m + '(' + gl(s.m, s.meaning) + ')'));
    if (b.unknown) eq.push(b.unknown + '(未识别)');
    if (eq.length > 1) {
      html += `<div class="meaning"><div class="label">构成逻辑</div>
        <span class="eq">${eq.join(' + ')}</span>
        <br>合起来大致是「${compose(b)}」——结合此含义理解单词的完整词义。</div>`;
    }

    // 同根词：查 MORPH_INDEX（可点击跳转），无结果时回退词根表例词
    const cog2 = findCognates(r.word);
    let cogMorphs = cog2.morphs || [];
    if (!cogMorphs.length && b.cognates && b.cognates.length) {
      cogMorphs = [{ m: b.roots[0] && b.roots[0].m, words: b.cognates }];
    }
    html += examplesBlock(r.word, null);
    html += (lastRel = relBlock(r.word, { srcs: [], morphs: cogMorphs }));
    html += `</div>`;
  } else {
    html += `<div class="card"><div class="miss">
      ${r.reason}<br>`;
    if (r.suggestion && r.suggestion !== r.word) {
      html += `你是不是想查 <span class="cog" data-w="${r.suggestion}">${r.suggestion}</span>？（点击跳转）<br>`;
    }
    html += `这个词很可能是自由词素（基本词）或词源特殊。试试其他单词，或运行"下载增强词表"扩大覆盖。
    </div></div>`;
    lastRel = '';   // 清空：否则左侧栏会继续显示上一个词的相关词汇
  }

  html += memoBlockHTML(r);   // 💡 AI 助记（无拆解/查不到的词返回空串）

  return html;
}

/* 词频徽章：BNC-COCA（Paul Nation 的词族词频表）按「千词族」分 1k–9k 级。
   查到就把级别挂在标题旁——备考时"这个词值不值得先学"一眼有数。
   数据是学术机构公开发布的，与牛津/Etymonline 那些不能公开分发的不同，可以随仓库走。 */
function bncLevelOf(r) {
  const w = String((r && (r.headword || r.word)) || '').toLowerCase();
  return w ? (BNC_LEVEL.get(w) || '') : '';
}
function decorateBnc(scope, r) {
  const lv = bncLevelOf(r);
  if (!lv) return;
  const wEl = scope.querySelector('.word-line .word');
  if (!wEl) return;
  wEl.insertAdjacentHTML('afterend',
    '<span class="badge bnc" title="' + (EN_MODE()
      ? 'Word frequency band ' + lv + 'k (BNC/COCA merged list by Paul Nation) — in the ' + lv + 'k most frequent word families'
      : '词频等级 ' + lv + 'k：属于最常用的第 ' + lv + ' 个千词族。分级依据 BNC（英式）+ COCA（美式）两个语料库合并后的词族频次，Paul Nation 编制') +
    '">' + (EN_MODE() ? 'Top ' + lv + 'k' : '前 ' + lv + 'k 词') + '</span>');
}

function render(r) {
  result.innerHTML = cardHTML(r);
  decorateBnc(result, r);
  result.classList.add('show');
  if (worthRecording(r)) saveHistory(r);
  const side = document.getElementById('side-rel');
  if (side) side.innerHTML = lastRel;
  translateDOM(document.body);   // 必须放在左侧栏赋值之后：栏内容也是这个函数渲染的
}

/* 装载完成后，把当时被搁置的查询补上：主查询 + 右侧面板各查一次。
   面板那条以前是漏的——它显示着"还在装载"就再也不会更新了。 */
function flushPendingWords() {
  if (!PENDING_WORDS.size) return;
  const redoMain = PENDING_WORDS.has(input.value.trim());
  const panelOpen = document.getElementById('panel').classList.contains('open');
  const redoPanel = panelOpen && lastPanelWord && PENDING_WORDS.has(lastPanelWord);
  PENDING_WORDS.clear();
  if (redoMain) search();
  if (redoPanel) { NAV.back = true; openPanel(lastPanelWord); NAV.back = false; }  // 补查不该再入栈
}

/* 第三态：把「词典还没装完，暂时查不到」和「真的没有这个词」分开。
   后台还在装 ecdict 时，查不到的词很可能就在里面——直接说"未发现结构"是误报。 */
function renderLoadingCard(w) {
  PENDING_WORDS.add(w);
  result.innerHTML = '<div class="card"><div class="miss">词典还在装载（' + loadFrac() +
    '）…<br>「' + escapeHtml(w) + '」暂时查不到，不代表它不存在；装载完成后会自动重查。' +
    (PENDING_WORDS.size > 1 ? '<br><span style="opacity:.7">已排队 ' + PENDING_WORDS.size + ' 个待重查的词</span>' : '') +
    '</div></div>';
  result.classList.add('show');
}

/* 搜索联想：enhanced + oxford 主词条，前缀匹配 */
const SUGGEST = [];
function buildSuggest() {
  const s = new Set();
  for (const w in ENHANCED) if (w.length >= 2) s.add(w);
  for (const w in OXFORD) if (!OXFORD[w].link && w.length >= 2) s.add(w);
  SUGGEST.length = 0;
  SUGGEST.push(...[...s].sort());
}
let sgIndex = -1;
function showSuggest(q) {
  const el = document.getElementById('suggest');
  const key = (q || '').toLowerCase().replace(/[^a-z]/g, '');
  if (!key || key.length < 2) { hideSuggest(); return; }
  const hits = [];
  for (const w of SUGGEST) { if (w.startsWith(key)) { hits.push(w); if (hits.length >= 10) break; } }
  if (!hits.length) { hideSuggest(); return; }
  if (sgIndex >= hits.length) sgIndex = -1;
  el.innerHTML = hits.map((w, i) => `<div class="sg-item${i === sgIndex ? ' cur' : ''}" data-w="${w}">${escapeHtml(w)}</div>`).join('');
  el.style.display = 'block';
}
function hideSuggest() {
  const el = document.getElementById('suggest');
  if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  sgIndex = -1;
}

function search() {
  const v = input.value.trim();
  if (!v) return;
  pushNav(v, 'main');
  // 交还焦点：输入框是 autofocus，焦点留在里面会吞掉空格/[ ] 等全局快捷键
  // （查完词的动作是"看卡片"，再查按 / 或点一下输入框）
  input.blur();
  if (!QUERY_READY) {   // 核心两层都没到位才挡，之后一律放行
    result.innerHTML = '<div class="card"><div class="miss">词库仍在加载，请稍候片刻再试…</div></div>';
    result.classList.add('show');
    return;
  }
  // 含空格：先智能判断是否命中 ECDICT 短语 → 整串查短语卡；否则段落阅读逐词展开
  if (/\s/.test(v)) {
    const ph = normalizePhrase(v);
    if (ECDICT[ph]) { renderPhrase(ph, ECDICT[ph], v); return; }
    renderParagraph(v);
    return;
  }
  const r = analyze(v);
  if (!r.found && !DATA_READY) { renderLoadingCard(v); return; }   // 装完之前不轻言"没这个词"
  render(r);
}

/* ============================================================
   段落阅读模式：贴一段话进来，点词内联展开拆解
   ============================================================ */
/* ---------- 短语查询（智能判断：整串命中 ECDICT 短语则整体查询） ---------- */
// 归一化成 ECDICT 短语 key：去首尾空白、转小写、连续空格压成一个
function normalizePhrase(v) {
  return v.trim().toLowerCase().replace(/[ \t]+/g, ' ');
}

/* 渲染一张「短语卡」。短语无词根词缀可拆，只展示音标/词性/中文释义，
   并给「改作段落阅读」兜底——若用户本意是读句子，可一键切换逐词展开。 */
function renderPhrase(phr, rec, raw) {
  const fav = isFav(phr);
  let html = '<div class="card">';
  html += '<div class="word-line">'
    + '<span class="word">' + escapeHtml(phr) + '</span>'
    + '<span class="badge">短语</span>'
    + '<button class="tts-btn" data-text="' + escapeHtml(phr) + '" title="朗读">🔊</button>'
    + '<button class="fav-btn' + (fav ? ' on' : '') + '" data-fav="' + escapeHtml(phr) + '">' + (fav ? '★ 已收藏' : '☆ 收藏') + '</button>'
    + '</div>';
  if (rec.p) html += '<div class="meaning"><div class="label">音标</div>' + escapeHtml(ipa(rec.p)) + '</div>';
  if (rec.g) html += '<div class="meaning"><div class="label">词性</div>' + escapeHtml(rec.g) + '</div>';
  if (rec.t) {
    html += '<div class="meaning"><div class="label">释义</div>' + escapeHtml(nl(rec.t)).replace(/\n/g, '<br>') + '</div>';
  } else {
    html += '<div class="meaning"><div class="label">释义</div><div class="miss">词典暂未收录该短语的释义。</div></div>';
  }
  // 例句：从例句库反查用到该短语的完整句子（牛津/朗文/柯林斯/增强表）
  const exs = phraseExamples(phr);
  if (exs.length) {
    html += '<div class="meaning"><div class="label">例句</div>';
    exs.forEach(x => {
      html += '<div class="ex"><div class="ex-en"><span class="ex-en-txt">' + hlWord(phr, x.en) + '</span>'
        + '<button class="tts-btn ex-tts" data-text="' + escapeHtml(x.en).replace(/"/g, '&quot;') + '" title="朗读英文例句">🔊</button></div>';
      if (x.zh) html += '<div class="ex-zh">' + escapeHtml(x.zh) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<div class="meaning"><button class="switch-btn" data-switch-para="' + escapeHtml(raw) + '">原文其实是段话？切换「段落阅读」逐词展开 →</button></div>';
  html += '</div>';
  result.innerHTML = html;
  result.classList.add('show');
  translateDOM(result);
  saveHistory({ word: phr, source: 'ecdict', ecdict: rec });
}

// 正则转义：短语里可能含 . ( ) 等特殊字符，拼 regex 前先转义
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// 例句库反查：找「用到该短语」的完整句子。
// EXAMPLES 由 oxford + enhanced + 朗文/柯林斯扁平化而来（≈19.5 万句），短语无自带例句，靠这个兜底。
const phrExCache = new Map();
function phraseExamples(phr) {
  if (phrExCache.has(phr)) return phrExCache.get(phr);
  const re = new RegExp('\\b' + escapeRegex(phr) + '\\b', 'i');
  const out = [];
  for (const x of EXAMPLES) {
    if (x.en && re.test(x.en)) { out.push({ en: decodeEntities(x.en), zh: decodeEntities(x.zh || '') }); if (out.length >= 3) break; }
  }
  // 空结果不缓存：EXAMPLES 是 loadData 末尾在空闲回调里才建好的，若在它建好之前查了某个短语，
  // 会把"没例句"永久钉在缓存里（刷新才恢复）；索引没就绪时也一样不缓存
  if (out.length && EXAMPLES_READY) phrExCache.set(phr, out);
  return out;
}

// 高频功能词：段落里跳过，不作为可点词
const FUNC_WORDS = new Set(['the','a','an','to','of','in','on','at','for','with','by','and','or','but','so','as','from','into','onto','this','that','these','those','there','it','its','is','are','was','were','be','been','am','has','have','had','do','does','did','will','would','can','could','shall','should','may','might','not','no','yes','i','me','my','we','us','our','you','your','he','him','his','she','her','they','them','their']);

// 判断一个词在段落里是否值得展开：功能词跳过；builtin 拆解需"已识别覆盖>=60%且含词根"；
// 词典词（enhanced/ecdict）是真词，显示释义。
function noteHasValue(r, w) {
  if (FUNC_WORDS.has(w)) return false;
  if (!r || !r.found) return false;
  if (r.source === 'builtin' && r.breakdown) {
    const b = r.breakdown;
    const ident = (b.prefix ? b.prefix.m.length : 0)
      + (b.roots || []).reduce((n, x) => n + (x.isBase ? 0 : x.m.length), 0)
      + (b.suffixes || []).reduce((n, x) => n + x.m.length, 0);
    return (b.roots || []).length > 0 && ident / w.length >= 0.6;
  }
  return true;  // enhanced/ecdict
}

function renderParagraph(text) {
  // 按单词切分，保留标点空格。词: [A-Za-z']+，其余原样。
  const tokens = text.split(/([A-Za-z']+)/);
  const analyzed = new Map();  // word -> {r, note} 缓存，避免重复拆解
  let html = '<div class="para-head"><button class="tts-btn" data-text="' +
    escapeHtml(text).replace(/"/g, '&quot;') + '" title="朗读整段">🔊 朗读整段</button>' +
    '<button class="trans-btn" data-trans="' + escapeHtml(text).replace(/"/g, '&quot;') + '" title="本地 LLM 翻译整段">🌐 译整段</button>';
  // 反向提示：这一整串恰好是词典收录的短语？给「作为短语查询」入口
  const phKey = normalizePhrase(text).replace(/[^a-z\s]/g, '').trim();
  if (ECDICT[phKey]) {
    html += '<button class="switch-btn" data-switch-phr="' + escapeHtml(phKey) + '">整串是短语「' + escapeHtml(phKey) + '」？作为短语查询 →</button>';
  }
  html += '</div><div class="para">';
  for (const tok of tokens) {
    if (!tok) continue;
    if (/^[A-Za-z']+$/.test(tok)) {
      const key = tok.toLowerCase().replace(/[^a-z]/g, '');
      let entry = analyzed.get(key);
      if (!entry) {
        const r = analyze(key);
        analyzed.set(key, entry = { r });
      }
      if (noteHasValue(entry.r, key)) {
        // 有拆解/释义的词 → 可点击 token，点击切右侧面板
        html += `<span class="ptok" data-w="${tok}">${tok}</span> `;
      } else {
        html += `<span>${tok}</span> `;
      }
    } else {
      html += escapeHtml(tok);
    }
  }
  html += '</div>';
  html += '<div class="trans" id="trans-box" style="display:none"></div>';
  result.innerHTML = html;
  result.classList.add('show');
}

/* 翻译整段：调本地 Ollama（经 server.py /translate 代理），结果渲染到段落下方 */
let _transLoading = false;
async function translateParagraph(text) {
  const box = document.getElementById('trans-box');
  if (!box) return;
  if (_transLoading) return;
  _transLoading = true;
  box.style.display = 'block';
  box.className = 'trans';
  // 头部：难句更精准开关 + 身体区（流式译文 / 完成后逐句对照）
  box.innerHTML = '<div class="trans-head">' +
    '<label class="trans-toggle"><input type="checkbox" id="trans-think"' +
    (localStorage.getItem('wr_trans_think') === '1' ? ' checked' : '') +
    ' onchange="localStorage.setItem(\'wr_trans_think\', this.checked ? \'1\' : \'0\')"> 难句更精准</label>' +
    '<span class="trans-hint">译文不准时开启，更贴切但慢些</span>' +
    '</div><div class="trans-body" id="trans-body"><div class="trans-stream">翻译中…（本地模型，长文稍慢）</div></div>';
  const body = document.getElementById('trans-body');
  body.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const think = document.getElementById('trans-think').checked;
  try {
    const r = await fetch('/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, think })
    });
    const ct = r.headers.get('content-type') || '';
    if (ct.includes('json')) {
      const j = await r.json().catch(() => ({}));
      body.innerHTML = '<div class="trans-err">翻译失败：' + (j.err || '未知错误') + '</div>';
    } else {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let acc = '';
      const stream = document.createElement('div');
      stream.className = 'trans-stream';
      body.textContent = '';
      body.appendChild(stream);
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        acc += dec.decode(value, { stream: true });
        stream.textContent = acc;
      }
      body.innerHTML = renderSentencePair(text, acc);   // 完成后重排成逐句对照
    }
  } catch (e) {
    body.innerHTML = '<div class="trans-err">翻译失败：' + (e.message || '网络错误') + '</div>';
  } finally {
    _transLoading = false;
  }
}

/* 按句子边界把一段文字切成句子（isEn=true 用英文标点，false 用中文标点） */
function splitSentences(s, isEn) {
  const out = [], endRe = isEn ? /[.!?]/ : /[。！？]/;
  let cur = '';
  for (const ch of s) {
    cur += ch;
    if (endRe.test(ch)) { if (cur.trim()) out.push(cur.trim()); cur = ''; }
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

/* 逐句对照：英文句（单词可点，点开词根拆解）与中文译文逐句配对展示 */
function renderSentencePair(en, zh) {
  const enS = splitSentences(en, true), zhS = splitSentences(zh, false);
  const n = Math.max(enS.length, zhS.length);
  let h = '<div class="sided">';
  for (let i = 0; i < n; i++) {
    const e = enS[i] || '', z = zhS[i] || '';
    let enHtml = '';
    for (const tok of e.split(/([A-Za-z']+)/)) {
      if (tok && /^[A-Za-z']+$/.test(tok)) {
        const key = tok.toLowerCase().replace(/[^a-z]/g, '');
        if (!key || FUNC_WORDS.has(key)) enHtml += escapeHtml(tok);
        else enHtml += '<span class="ptok" data-w="' + escapeHtml(tok) + '" title="点开词根拆解">' + escapeHtml(tok) + '</span>';
      } else {
        enHtml += escapeHtml(tok);
      }
    }
    h += '<div class="sided-item">' +
      '<div class="sided-en">' + enHtml + '</div>' +
      (z ? '<div class="sided-zh">' + escapeHtml(z) + '</div>' : '') +
      '</div>';
  }
  return h + '</div>';
}

/* 浏览栈：记录"看过哪些词"，供 Alt+← / Alt+[ 逐层退回。
   入栈收口在 search() 和 openPanel() 两处，天然覆盖历史点击、联想选中、
   拖拽、.cog 点击、段落/短语切换等所有查词入口。 */
const NAV = { stack: [], fwd: [], back: false };
function pushNav(w, src) {
  if (!w || NAV.back) return;          // 回退过程中不再入栈，否则栈会原地打转
  const top = NAV.stack[NAV.stack.length - 1];
  if (top && top.w === w) return;      // 相邻重复不压
  NAV.fwd.length = 0;                  // 新的浏览动作作废前进栈（同浏览器：查新词后「下一个」失效）
  NAV.stack.push({ w: w, src: src });
  if (NAV.stack.length > 50) NAV.stack.shift();
}
// 退回上一个浏览过的词：面板里打开的回到面板，其余回到主查询。
// 注意 search()/openPanel() 是把「正在看的词」压在栈顶的，所以要先把它丢掉，
// 再取新的栈顶当目标——否则第一次按等于把当前词重显示一遍（看起来像没反应）。
function navBack() {
  if (NAV.stack.length < 2) return;      // 只有当前词，没有可回退的
  NAV.fwd.push(NAV.stack.pop());         // 当前词进前进栈，使 ] 能原路返回
  const prev = NAV.stack[NAV.stack.length - 1];
  NAV.back = true;
  if (prev.src === 'panel' && document.getElementById('panel').classList.contains('open')) {
    openPanel(prev.w);
  } else {
    switchTab('query');
    input.value = prev.w;
    search();
  }
  NAV.back = false;
}
// 前进：与 navBack 对称，走 navBack 退回来的那条路
function navForward() {
  if (!NAV.fwd.length) return;
  const next = NAV.fwd.pop();
  NAV.back = true;
  if (next.src === 'panel' && document.getElementById('panel').classList.contains('open')) {
    openPanel(next.w);
  } else {
    switchTab('query');
    input.value = next.w;
    search();
  }
  NAV.back = false;
}

/* 右侧滑出面板：段落深读用，复用 cardHTML 渲染完整卡片 */
let lastPanelWord = '';   // 面板当前显示的词，装载完成后要拿它补查
function openPanel(word) {
  lastPanelWord = word;
  pushNav(word, 'panel');
  const r = analyze(word);
  const body = document.getElementById('panel-body');
  if (!r.found && !DATA_READY) {
    // 段落模式点词走的是这条路径，绕过了 search() 的就绪判断，必须单独兜
    PENDING_WORDS.add(word);
    body.innerHTML = '<div class="card"><div class="miss">词典还在装载（' + loadFrac() +
      '）…<br>「' + escapeHtml(word) + '」暂时查不到，不代表它不存在。</div></div>';
  } else {
    body.innerHTML = cardHTML(r);
    decorateBnc(body, r);
  }
  document.getElementById('panel-title').textContent = word + (EN_MODE() ? ' · details' : ' · 详细');
  document.getElementById('panel-mask').classList.add('show');
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel-mask').classList.remove('show');
}

/* ---------- 查词记录（localStorage，本地保存） ---------- */
const HIST_KEY = 'wr_history';
const HIST_PRUNED_KEY = 'wr_hist_pruned_v2';   // 一次性清理标记（见 pruneJunkHistory）
/* ---------- 收藏 ---------- */
const FAV_KEY = 'wr_favs';
function loadFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { return []; } }
function saveFavs(f) { try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }
function isFav(w) { return loadFavs().includes(w); }
function toggleFav(w) {
  let f = loadFavs();
  if (f.includes(w)) f = f.filter(x => x !== w);
  else f.unshift(w);
  saveFavs(f);
  return f.includes(w);
}
/* 收藏/历史摘要：enhanced → oxford(跟随重定向) → ecdict */
function summaryFor(w) {
  // 英文模式优先取英文释义：牛津 def_en → 全量词典 d → 考试词表（只有中文）
  if (EN_MODE()) {
    const ox = oxfordLookup(w);
    if (ox && ox.o && ox.o.def_en) return ((ox.o.pos || '') + ' ' + ox.o.def_en.split('\n')[0]).trim();
    if (ECDICT[w] && nl(ECDICT[w].d)) return nl(ECDICT[w].d).split('\n')[0].trim();
    if (ENHANCED[w] && ENHANCED[w].meaning) return ENHANCED[w].meaning.split('\n')[0];
    return '';
  }
  if (ENHANCED[w]) return (ENHANCED[w].meaning || '').split('\n')[0] || '';
  const ox = oxfordLookup(w);
  if (ox && ox.o) return ((ox.o.pos || '') + ' ' + (ox.o.def_zh || '').split('\n')[0]).trim();
  if (ECDICT[w]) return (nl(ECDICT[w].t) || '').split('\n')[0] || '';   // ecdict 的 t 用字面 \n 分隔多行，必须先过 nl()
  return '';
}

function renderFavs() {
  const el = document.getElementById('favlist');
  if (!el) return;
  const f = loadFavs();
  if (!f.length) {
    el.innerHTML = '<div class="card"><div class="miss">还没有收藏的单词。查询一个词，点右上角「☆ 收藏」即可加入。</div></div>';
    return;
  }
  let h = '<div class="h-head">收藏（' + f.length + '）';
  h += '<button class="h-btn" id="fav-clear">清空收藏</button></div>';
  f.forEach(w => {
    h += '<div class="h-item" data-word="' + escapeHtml(w) + '">' +
      '<span class="h-w">' + escapeHtml(w) + '</span>' +
      '<span class="h-s">' + escapeHtml(summaryFor(w)) + '</span>' +   // 词典释义里有 <英> 这类标记，不转义会被当标签吞掉
      '<span class="fav-rm" data-del="' + escapeHtml(w) + '">✕</span>' +
      '</div>';
  });
  el.innerHTML = h;
  translateDOM(el);
}
/* Tab 切换 */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  posTabInd();
  const showFav = name === 'fav';
  const showEx = name === 'ex';
  const showRoots = name === 'roots';
  const showFreq = name === 'freq';
  document.getElementById('favlist').style.display = showFav ? 'block' : 'none';
  document.getElementById('exsearch').style.display = showEx ? 'block' : 'none';
  document.getElementById('rootsview').style.display = showRoots ? 'block' : 'none';
  document.getElementById('freqview').style.display = showFreq ? 'block' : 'none';
  // #result / #history 靠 CSS 的 .show 类显示，这里给 inline '' 会回落到 display:none；
  // 词根/词频 tab 也必须算进隐藏条件，否则上一次查词卡会留在目录上方
  document.getElementById('result').style.display = (showFav || showEx || showRoots || showFreq) ? 'none' : '';
  document.getElementById('history').style.display = (showFav || showEx || showRoots || showFreq) ? 'none' : '';
  // 左侧「相关词汇」栏是 fixed 定位，切到目录类 tab 时要收起来，否则会压在列表上
  const side = document.getElementById('side-rel');
  if (side) side.style.display = (showFav || showEx || showRoots || showFreq) ? 'none' : '';
  if (showFav) renderFavs();
  if (showRoots) paintRoots();
  if (showFreq) paintFreq();
  if (showEx) {
    const iv = document.getElementById('ex-input').value.trim();
    if (iv) searchExamples(iv);
  }
}

/* ============================================================
   词根目录：把 ROOTS / PREFIXES / SUFFIXES 变成能主动浏览的目录。
   数据全部现成——词素、含义、例词来自词根表，词族来自 MORPH_INDEX。
   ============================================================ */
const ROOT_ENTRIES = [];
let rootsBuilt = false;
let rootsKind = 'all';       // all | prefix | root | suffix
let rootsLimit = 200;        // 默认只画前 200 条，避免一次生成上千个节点
const ROOTS_OPEN = new Set();   // 展开了哪些词素（切走再回来不丢）

const RD_KIND = { prefix: '前缀', root: '词根', suffix: '后缀' };

function buildRoots() {
  if (rootsBuilt) return;
  // 同一词素可能在两张表里都有（579 个组合形式既是前缀又是词根，如 auto/bio/abdomin），
  // 只留一条、以词根身份为准——否则三色化之后同名条目会顶着两种颜色出现两次。
  const seenM = new Set();
  for (const [m, v] of Object.entries(ROOTS)) {
    // ROOTS 里混着一条裸字符串（aic，疑似从后缀表误粘），
    // 不兜的话 v[1]/v[2] 会取到单个汉字，渲染出假含义和假词源。
    const arr = Array.isArray(v);
    ROOT_ENTRIES.push({
      m: m, kind: 'root',
      meaning: arr ? (v[0] || '') : String(v || ''),
      examples: (arr && Array.isArray(v[1])) ? v[1] : [],
      src: (arr && v[2]) ? v[2] : null
    });
    seenM.add(m);
  }
  for (const [m, mean] of Object.entries(PREFIXES)) {
    if (seenM.has(m)) continue;
    seenM.add(m);
    ROOT_ENTRIES.push({ m: m, kind: 'prefix', meaning: mean, examples: [], src: null });
  }
  for (const [m, mean] of Object.entries(SUFFIXES)) {
    if (seenM.has(m)) continue;
    seenM.add(m);
    ROOT_ENTRIES.push({ m: m, kind: 'suffix', meaning: mean, examples: [], src: null });
  }
  ROOT_ENTRIES.sort((a, b) => a.m < b.m ? -1 : a.m > b.m ? 1 : 0);
  rootsBuilt = true;
}

function rootsMatched() {
  const q = (document.getElementById('rd-input').value || '').trim().toLowerCase();
  return ROOT_ENTRIES.filter(e => {
    if (rootsKind !== 'all' && e.kind !== rootsKind) return false;
    if (!q) return true;
    return e.m.toLowerCase().includes(q) || e.meaning.toLowerCase().includes(q);
  });
}

function rdTag(w) {
  return '<span class="cog" data-rootw="' + escapeHtml(w) + '">' + escapeHtml(w) + '</span>';
}

/* 某个词素的详情：词源 + 表内例词 + 查词积累。
   两个词表刻意分开——「表内例词」是词根表里写死的权威举例；
   「查词积累」来自 MORPH_INDEX，而它会被 findCognates 动态补录，
   所以你查过的词会累积进去、越用越全，它不等于「该词素的全部词」。 */
function rootDetailHTML(e) {
  let h = '';
  if (e.src && e.src.lang) {
    h += '<div class="rd-sub">词源</div><div>' + escapeHtml(langEn(e.src.lang)) + ' ' +
      escapeHtml(e.src.word || '') + ((!EN_MODE() && e.src.note) ? '（' + escapeHtml(e.src.note) + '）' : '') + '</div>';
  }
  const ex = e.examples || [];
  const exSet = new Set(ex);
  if (ex.length) {
    h += '<div class="rd-sub">表内例词（' + ex.length + '）</div><div>' +
      ex.slice(0, 30).map(rdTag).join('') +
      (ex.length > 30 ? '<span class="rd-n">…等 ' + ex.length + ' 个</span>' : '') + '</div>';
  }
  const mates = MORPH_INDEX.get(e.m);
  const extra = mates ? [...mates].filter(w => !exSet.has(w)) : [];
  if (extra.length) {
    h += '<div class="rd-sub">查词积累（' + extra.length + '）<span class="rd-n">查询过的词会累积到这里</span></div><div>' +
      extra.slice(0, 40).map(rdTag).join('') +
      (extra.length > 40 ? '<span class="rd-n">…等 ' + extra.length + ' 个</span>' : '') + '</div>';
  }
  if (!ex.length && !extra.length) h += '<div class="rd-n" style="margin-top:8px">词根表里还没有收录例词。</div>';
  // 把这个词素下的词丢给例句库，看它们在真实句子里怎么用
  const all = ex.concat(extra);
  if (all.length) {
    h += '<div class="rd-more" style="text-align:left"><button class="h-btn" data-seewords="' +
      escapeHtml(JSON.stringify(all.slice(0, 60))) + '" data-seetitle="' + escapeHtml('词根 ' + e.m) +
      '">📖 看这个词根下的例句</button></div>';
  }
  return h;
}

function paintRoots() {
  buildRoots();
  const chips = document.getElementById('rd-chips');
  const list = document.getElementById('rd-list');
  if (!chips || !list) return;
  const hits = rootsMatched();

  // chip 上直接标数量——"今天专刷否定前缀"这类用法得先知道各有多少条
  const cnt = { all: ROOT_ENTRIES.length, prefix: 0, root: 0, suffix: 0 };
  for (const e of ROOT_ENTRIES) cnt[e.kind] = (cnt[e.kind] || 0) + 1;
  chips.innerHTML = ['all', 'prefix', 'root', 'suffix'].map(k =>
    '<button class="rd-chip' + (rootsKind === k ? ' on' : '') + '" data-rdkind="' + k + '">' +
    (k === 'all' ? '全部' : RD_KIND[k]) + ' ' + cnt[k] + '</button>').join('') +
    '<span class="rd-n" style="margin-left:auto">共 ' + hits.length + ' 个</span>';

  if (!hits.length) {
    list.innerHTML = '<div class="card"><div class="miss">没有匹配的词素。换个关键词试试。</div></div>';
    return;
  }
  const shown = hits.slice(0, rootsLimit);
  let h = '', lastLetter = '';
  for (const e of shown) {
    const L = (e.m[0] || '#').toUpperCase();
    if (L !== lastLetter) { h += '<div class="rd-letter">' + escapeHtml(L) + '</div>'; lastLetter = L; }
    const mates = MORPH_INDEX.get(e.m);
    h += '<div class="rd-item"><div class="rd-head" data-rdm="' + escapeHtml(e.m) + '">' +
      '<span class="rd-m ' + (e.kind === 'prefix' ? 'pf' : e.kind === 'suffix' ? 'sf' : 'rt') + '">' + escapeHtml(e.m) + '</span>' +
      '<span class="rd-mean">' + escapeHtml(gl(e.m, e.meaning)) + '</span>' +
      '<span class="rd-n">' + (e.examples.length ? e.examples.length + ' 例词' : '') +
      (mates && mates.size ? (e.examples.length ? ' · ' : '') + '已见 ' + mates.size : '') + '</span>' +
      '</div>';
    if (ROOTS_OPEN.has(e.m)) h += '<div class="rd-body">' + rootDetailHTML(e) + '</div>';
    h += '</div>';
  }
  if (hits.length > shown.length) {
    h += '<div class="rd-more"><button class="h-btn" id="rd-more">继续加载（还有 ' +
      (hits.length - shown.length) + ' 个）</button></div>';
  }
  list.innerHTML = h;
  translateDOM(chips);   // 词根目录是独立渲染路径，不走 render()——翻译层得自己补
  translateDOM(list);    // （切英文后，筛选按钮和「共 N 个 / 已见 N」都在这里生成）
}

/* 词频目录：按 BNC-COCA 的千词族级别浏览。
   按词频过单词比按词根更接近"过单词书"的习惯；收藏过的标 ★，方便看这一级走到哪了。
   数据是词族结构（首词 + 变形），所以 take/took/taken 只占一行。 */
let fqLevel = '1';
let fqLimit = 200;
function paintFreq() {
  const chips = document.getElementById('fq-chips');
  const list = document.getElementById('fq-list');
  if (!chips || !list) return;
  if (!BNC_FAMILIES) {
    list.innerHTML = '<div class="card"><div class="miss">词频数据（bnc.json）没加载上。</div></div>';
    return;
  }
  chips.innerHTML = Object.keys(BNC_FAMILIES).map(lv =>
    '<button class="rd-chip' + (fqLevel === lv ? ' on' : '') + '" data-fqlv="' + lv + '">' + lv + 'k</button>').join('') +
    '<span class="rd-n" style="margin-left:auto">第 ' + fqLevel + ' 个千词族 · 共 ' +
    Object.keys(BNC_FAMILIES[fqLevel]).length + ' 个</span>';
  const fams = Object.keys(BNC_FAMILIES[fqLevel]).sort();
  const shown = fams.slice(0, fqLimit);
  let h = '';
  for (const hw of shown) {
    const nl = BNC_FAMILIES[fqLevel][hw].length;
    h += '<div class="rd-item"><div class="rd-head" data-fq="' + escapeHtml(hw) + '">' +
      '<span class="rd-m rt" style="min-width:110px">' + (isFav(hw) ? '★ ' : '') + escapeHtml(hw) + '</span>' +
      '<span class="rd-mean">' + escapeHtml(summaryFor(hw) || '') + '</span>' +
      '<span class="rd-n">' + (nl ? nl + ' 个变形' : '') + '</span>' +
      '</div></div>';
  }
  if (fams.length > shown.length) {
    h += '<div class="rd-more"><button class="h-btn" id="fq-more">继续加载（还有 ' + (fams.length - shown.length) + ' 个）</button></div>';
  }
  list.innerHTML = h;
  translateDOM(chips);
  translateDOM(list);
}
document.getElementById('freqview').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-fqlv]');
  if (chip) { fqLevel = chip.dataset.fqlv; fqLimit = 200; paintFreq(); return; }
  if (e.target.id === 'fq-more') { fqLimit += 400; paintFreq(); return; }
  const head = e.target.closest('[data-fq]');
  // 走右侧面板：目录不被打断，关掉面板接着往下看（与段落模式点词一致）
  if (head) { openPanel(head.dataset.fq); return; }
});

let rdTimer = null;
document.getElementById('rd-input').addEventListener('input', () => {
  rootsLimit = 200;
  clearTimeout(rdTimer);
  rdTimer = setTimeout(paintRoots, 150);
});
document.getElementById('rootsview').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-rdkind]');
  if (chip) { rootsKind = chip.dataset.rdkind; rootsLimit = 200; paintRoots(); return; }
  if (e.target.id === 'rd-more') { rootsLimit += 400; paintRoots(); return; }
  const w = e.target.closest('[data-rootw]');
  if (w) { switchTab('query'); input.value = w.dataset.rootw; search(); return; }
  const head = e.target.closest('[data-rdm]');
  if (head) {
    const m = head.dataset.rdm;
    if (ROOTS_OPEN.has(m)) ROOTS_OPEN.delete(m); else ROOTS_OPEN.add(m);
    paintRoots();
  }
});

/* 例句索引：loadData 时从 oxford + enhanced 扁平化一次（≈14 万条） */
const EXAMPLES = [];
function buildExamples() {
  // src 用来做来源筛选与徽章：牛津 / 考纲 / 朗文(ldoce) / 柯林斯(collins)
  for (const w in OXFORD) {
    const o = OXFORD[w];
    if (o && !o.link) for (const ex of o.examples || []) EXAMPLES.push({ w, en: ex[0] || '', zh: ex[1] || '', src: 'oxford' });
  }
  for (const w in ENHANCED) {
    const e = ENHANCED[w];
    for (const ex of e.examples || []) {
      const s = ex.split(' / ');
      EXAMPLES.push({ w, en: s[0] || '', zh: s.slice(1).join(' / ') || '', src: 'exam' });
    }
  }
  for (const w in EX) {
    if (w.charAt(0) === '_') continue;   // ex.json 里混着 _er/_ful/_y/_ory 这类后缀键，不是词头
    for (const x of EX[w] || []) EXAMPLES.push({ w, en: x.en || '', zh: x.zh || '', src: x.s || '' });
  }
}

// 在句中找到目标词形（容忍常见词形变化）；找不到返回 null。
// 93.4% 的例句能命中，剩下的是习语或派生形式（aback 在 "taken aback" 里）。
function exFindTarget(x, prefer) {
  if (!x || !x.en) return null;
  // prefer：搜索模式下优先挖「你正在查的那个词」。否则搜 bus 出来 "a bus route"，
  // 挖的却是这条例句所属的 route——你正想着 bus，它却考你 route。
  const cands = [prefer, x.w].filter(Boolean);
  for (const c of cands) {
    const re = new RegExp('\\b' + escapeRegex(String(c).trim()) + '(ies|ing|est|es|ed|er|s|d)?\\b', 'i');
    const m = re.exec(x.en);
    if (m) return m;
  }
  return null;
}

/* ECDICT 的 p 字段有 1311 条把 ə（西里尔 ә）写成了 4 个字面反斜杠
   （per se → p\\: 'sei、about-turn → әbajt't\\:n），渲染时还原。
   刻意不改数据文件：ecdict.json 是 66MB 单行 JSON，动一个字符 git diff 就是整个文件。 */
const IPA_BAD = '\\'.repeat(4);   // 4 个字面反斜杠
/* 美音数据源（English-IPA/openDictUS，12.6 万条）把重音符写在**音节的元音前面**：
   krˈɪpt、sˈɪstəm、strˈit、blˈæk，标准写法该在整个音节（含起首辅音簇）之前 → ˈkrɪpt。
   规则只挪「重音符前面没有任何元音」（即处在词首音节内）且后面紧跟元音的那些：
   中段重音（gymnasium ʤɪmnˈeɪziəm、photograph 的 ˌ）前面都有元音，规则自然不碰；
   元音符号不在表里的（生僻音标）也不会误动——前后两个判断用的是同一个音素集合。
   实测 12.6 万条里 8.8 万条是这种写法，重写 enhanced/ecdict 数据动静太大，在渲染层归一。 */
const IPA_VOWEL = /[aeiouɑɒæʌəɛɪʊɔɜɐøœy]/;
function fixIpaSeg(seg) {
  const m = /^([^ˈˌ\s]*)([ˈˌ])(.*)$/.exec(seg);
  if (!m || !m[1] || IPA_VOWEL.test(m[1]) || !IPA_VOWEL.test(m[3].charAt(0))) return seg;
  return m[2] + m[1] + m[3];
}
// 音标串里每个 /…/ 段各修一遍（"UK /krɪpt/ · US /krˈɪpt/" 两段都过）
const ipaNorm = s => (s == null) ? s : String(s).replace(/\/([^/]+)\//g, (all, seg) => '/' + fixIpaSeg(seg) + '/');
const ipa = s => (s == null) ? s : ipaNorm(String(s).split(IPA_BAD).join('ә'));

// 当前模式下该拿哪个词当挖空 / 高亮的目标
function exFocus(x) {
  return (exMode === 'search' && exQuery) ? exQuery : ((x && x.w) || '');
}

/* 例句搜索：子串匹配英文例句，展示中英对照 + 词头跳转 + 朗读 */
/* ---------- 例句 tab ----------
   搜索质量的三处改进：
   ① 整词命中排在子串命中前面（搜 bus 不该让 busy/business 挤在前面），同类里短句优先；
   ② 不再扫到 60 条就停：全量命中、准确计数、分页「加载更多」；
   ③ 按来源筛选（牛津/考纲/朗文/柯林斯）。
   另有「按词表搜例句」模式，供词根目录和词卡跳过来看真实语境。 */
const EX_SRC_LABEL = { oxford: '牛津', exam: '考纲', ldoce: '朗文', collins: '柯林斯' };
const EX_PAGE = 20;
let exAll = [];      // 不带来源筛选的全部命中（chip 要靠它统计有哪些来源）
let exHits = [];     // 应用来源筛选后的
let exShown = 0;
let exSrc = 'all';
let exQuery = '';    // 搜索模式下的查询串
let exTitle = '';    // 按词表模式下的标题
let exMode = 'search';

function exChipHTML() {
  const have = new Set(exAll.map(x => x.src));
  const kinds = ['oxford', 'exam', 'ldoce', 'collins'].filter(k => have.has(k));
  if (kinds.length < 2) return '';   // 只有一个来源时筛选没意义，不占地方
  return ['all'].concat(kinds).map(k =>
    '<button class="rd-chip' + (exSrc === k ? ' on' : '') + '" data-exsrc="' + k + '">' +
    (k === 'all' ? '全部' : EX_SRC_LABEL[k]) + '</button>').join('');
}

function renderExList() {
  const el = document.getElementById('ex-list');
  const chips = document.getElementById('ex-src');
  const cnt = document.getElementById('ex-count');
  if (chips) chips.innerHTML = exChipHTML();
  if (cnt) cnt.textContent = exHits.length
    ? (exMode === 'words' ? (exTitle + '：') : '') + '共 ' + exHits.length + ' 条'
      + (exSrc === 'all' ? '' : '（' + EX_SRC_LABEL[exSrc] + '）')
    : '';
  if (!exHits.length) {
    el.innerHTML = exMode === 'words'
      ? '<div class="card"><div class="miss">这些词在例句库里还没有例句。</div></div>'
      : '<div class="card"><div class="miss">没有找到包含「' + escapeHtml(exQuery) + '」的例句</div></div>';
    return;
  }
  const shown = Math.min(exShown, exHits.length);
  let h = '<div class="card">';
  exHits.slice(0, shown).forEach((x, i) => {
    const can = !!exFindTarget(x, exFocus(x));
    h += '<div class="ex"><div class="ex-en">' +
      (x.src ? '<span class="ex-src">' + (EX_SRC_LABEL[x.src] || '') + '</span>' : '') +
      '<span class="cog" data-w="' + escapeHtml(x.w) + '" style="margin-right:6px">' + escapeHtml(x.w) + '</span>' +
      '<span class="ex-en-txt">' + hlWord(exFocus(x), x.en) + '</span>' +
      '<button class="tts-btn ex-tts" data-text="' + escapeHtml(x.en).replace(/"/g, '&quot;') + '" title="朗读英文例句">🔊</button>' +
      '<button class="ex-practice" data-exi="' + i + '"' +
        (can ? ' title="挖空这句来练"' : ' disabled title="句中找不到目标词形，不能挖空"') + '>✏️</button>' +
      '</div>' +
      (x.zh ? '<div class="ex-zh">' + escapeHtml(x.zh) + '</div>' : '') + '</div>';
  });
  h += '</div>';
  if (exHits.length > shown) {
    h += '<div class="rd-more"><button class="h-btn" id="ex-more">加载更多（还有 ' +
      (exHits.length - shown) + ' 条）</button></div>';
  }
  h += '<div class="rd-more"><button class="h-btn" id="ex-practice-all">✏️ 把这批做成练习（' +
    exHits.filter(x => exFindTarget(x, exFocus(x))).length + ' 句可挖空）</button></div>';
  el.innerHTML = h;
  translateDOM(el);
}

function applyExSrcFilter() {
  exHits = exSrc === 'all' ? exAll : exAll.filter(x => x.src === exSrc);
  exShown = EX_PAGE;      // 换查询 / 换筛选都回到第一页
  renderExList();
}

// 全量搜索：整词命中 + 子串命中分两组，各自按句长升序（短句更好读、更适合当练习素材）
function searchExamples(q) {
  exMode = 'search';
  exTitle = '';
  exQuery = (q || '').trim();
  exShown = 0;
  exSrc = 'all';    // 否则上次点过的来源筛选会跟着新查询走：明明有例句却显示"没找到"，
                    // 而且新结果只剩一个来源时 chip 整块被隐藏，连"全部"都点不回来
  const el = document.getElementById('ex-list');
  const cnt = document.getElementById('ex-count');
  if (!exQuery) { exAll = []; exHits = []; el.innerHTML = ''; if (cnt) cnt.textContent = ''; renderExList(); return; }
  if (!EXAMPLES_READY) {   // 索引还没建好时说"没找到"也是误报
    el.innerHTML = '<div class="card"><div class="miss">例句库还在建立索引，稍等几秒再搜。</div></div>';
    if (cnt) cnt.textContent = '';
    return;
  }
  const key = exQuery.toLowerCase();
  const re = new RegExp('\\b' + escapeRegex(exQuery) + '\\b', 'i');
  const whole = [], part = [];
  for (let i = 0; i < EXAMPLES.length; i++) {
    const x = EXAMPLES[i];
    if (!x.en || x.en.length > 400 || !x.w) continue;      // 超长句不适合展示和挖空
    if (x.en.toLowerCase().indexOf(key) < 0) continue;
    (re.test(x.en) ? whole : part).push(x);
  }
  const byLen = (a, b) => a.en.length - b.en.length;
  whole.sort(byLen); part.sort(byLen);
  exAll = whole.concat(part);
  applyExSrcFilter();
}

// 按词表搜例句：从词根目录 / 词卡跳过来，看这批词在真实语境里怎么用
function searchExamplesByWords(words, title) {
  if (!EXAMPLES_READY) { alert('例句库还在建立索引，稍等几秒再试。'); return; }
  const set = new Set();
  (words || []).forEach(w => { const k = String(w).toLowerCase(); if (k) set.add(k); });
  const hits = [];
  for (let i = 0; i < EXAMPLES.length; i++) {
    const x = EXAMPLES[i];
    if (x.en && x.w && x.en.length <= 400 && set.has(x.w)) hits.push(x);   // 超长句不展示（同 searchExamples 的口径）
  }
  hits.sort((a, b) => a.en.length - b.en.length);
  exMode = 'words';
  exTitle = title || '这批词';
  exQuery = '';
  exSrc = 'all';
  exShown = 0;
  exAll = hits;
  document.getElementById('ex-input').value = '';
  switchTab('ex');
  applyExSrcFilter();
}

/* 让滑动指示条对准当前激活的 Tab */
function posTabInd() {
  const ind = document.getElementById('tab-ind');
  const active = document.querySelector('.tab.active');
  if (ind && active) { ind.style.left = active.offsetLeft + 'px'; ind.style.width = active.offsetWidth + 'px'; }
}

// 从分析结果里抽出一行摘要，方便扫一眼复习
function historySummary(r) {
  if (r.source === 'enhanced' && r.enhanced) {
    const e = r.enhanced;
    let s = (e.meaning || '').split('\n')[0].trim() || '';
    if (e.breakdown) s = (e.breakdown.split('\n')[0].trim() + ' · ' + s).replace(/^· /, '');
    return s;
  }
  if (r.source === 'oxford' && r.oxford) {
    const o = r.oxford;
    return ((o.pos || '') + ' ' + oxDefZh(o, r.word).split('\n')[0].trim()).trim() || '';
  }
  const b = r.breakdown;
  if (b) {
    const parts = [];
    if (b.prefix) parts.push(b.prefix.m + '(' + b.prefix.meaning + ')');
    (b.roots || []).forEach(r0 => parts.push(r0.m + '(' + r0.meaning + ')'));
    (b.suffixes || []).forEach(s0 => parts.push('-' + s0.m + '(' + s0.meaning + ')'));
    // partialDecompose 有"只有前缀、没有词根"的返回（拼错的词几乎都走这条：
    // seperate→se-+??perate、recieved→re-+??cieved），直接取 roots[0] 会抛 TypeError，
    // 后果是这个词根本进不了查词记录（saveHistory 在写盘前就断了）。
    if (r.source === 'builtin') return b.roots.length ? ('词根 · ' + b.roots[0].meaning) : parts.join(' + ');
    return parts.join(' + ');
  }
  if (r.ecdict) return (nl(r.ecdict.t) || '').split('\n')[0].trim() || '';
  return '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 解码 HTML 实体：数据里存的是 &amp;#x27; 这类，显示靠浏览器自动解码，
// 但朗读时传给 TTS 的是原始串，必须还原成真实字符（如 ' 和 "）。
function decodeEntities(s) {
  return String(s)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&#x27;/g, "'").replace(/&#39;/g, "'").replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}

let HISTORY = null;   // 历史权威：内存副本，源自本地服务读出的项目目录 history.json；null=尚未加载

/* ============================================================
   间隔重复（SRS）：历史条目除 {w,s,t} 外带两个可选字段——
   d = 到期时间戳，b = 记忆档位（对应 1/3/7/15/30/60 天）。
   忘了 → 档位归零、明天再见，并把该词塞回本轮队尾当次再看一遍；
   记住了 → 档位 +1，按间隔表排期。
   老记录没有 d/b，按「查词时间 +1 天」视为到期，所以不会算出 NaN。
   ============================================================ */
const SRS_DAYS = [1, 3, 7, 15, 30, 60];
const DAY_MS = 86400000;
// 归一化：给老记录补 d/b。两条读路径（服务文件 / localStorage 兜底）都要过一遍。
function normHistItem(x) {
  if (!x || typeof x !== 'object' || !x.w) return null;
  // k 是去重键：单词条目就是 w，句子练习条目是 'ex:词|句子'。
  // 老记录没有 k，补成 w（等价于原来的"按词去重"）。
  if (typeof x.k !== 'string' || !x.k) x.k = x.w;
  if (typeof x.d !== 'number') x.d = (typeof x.t === 'number' ? x.t : Date.now()) + DAY_MS;
  if (typeof x.b !== 'number' || x.b < 0 || x.b > SRS_DAYS.length - 1) x.b = 0;
  return x;
}
// 到期条目（含从没复习过的老记录）
function dueItems(h) {
  const now = Date.now();
  return h.filter(x => (typeof x.d === 'number' ? x.d : (x.t || 0) + DAY_MS) <= now);
}

// 启动时从本地服务拉全量历史（直接读项目目录下的 history.json，静默、不弹窗）
async function initHistory() {
  try {
    const d = await (await fetch('/history')).json();
    let items = (d && Array.isArray(d.items)) ? d.items : [];
    // 迁移：localStorage 里已有的旧记录与文件记录合并（同词保留最新），避免切换文件存储后丢数据
    let local = [];
    try { local = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { local = []; }
    const map = new Map();
    const prevHadSrs = new Map();   // 该词已收录的那条有没有复习进度（归一化后人人都有 d，必须提前记）
    items.concat(local).forEach(raw => {
      if (!raw || !raw.w) return;
      const had = typeof raw.d === 'number';
      const x = normHistItem(raw);
      // 按 k 合并：同一个词的多条例句练习是不同条目，不能互相覆盖
      if (!map.has(x.k)) { map.set(x.k, x); prevHadSrs.set(x.k, had); return; }
      const prevHad = prevHadSrs.get(x.k);
      // 一边有复习进度一边没有时，进度优先——否则文件里的老记录会覆盖掉 localStorage 里的 SRS 进度
      if (had !== prevHad) {
        if (had) { map.set(x.k, x); prevHadSrs.set(x.k, true); }
        return;
      }
      if ((x.t || 0) > (map.get(x.k).t || 0)) map.set(x.k, x);
    });
    HISTORY = [...map.values()].sort((a, b) => (b.t || 0) - (a.t || 0));
    if (local.length) persistHistory(HISTORY);   // 有旧记录则顺手写回文件，完成迁移
  } catch (e) { HISTORY = null; }   // 服务未就绪时回退 localStorage
  renderHistory();
  pruneJunkHistory();
}

// 读取历史：优先内存权威（项目文件），否则 localStorage 兜底
function loadHistory() {
  if (HISTORY) return HISTORY;
  // 服务不可用时的兜底：老记录没有 d/b，不过一遍 normHistItem 复习时会算出 NaN
  try { return (JSON.parse(localStorage.getItem(HIST_KEY)) || []).map(normHistItem).filter(Boolean); }
  catch (e) { return []; }
}

// 变更后落盘：更新内存副本 + 缓存 localStorage + 异步写项目文件（不阻塞、不弹窗）
function persistHistory(h) {
  HISTORY = h;
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); }
  catch (e) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 1000))); } catch (e2) {} }
  fetch('/history', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ version: 1, items: h }) }).catch(() => {});
}

/* 查词记录只收「真查到了」的词：瞎打的、拼错的（引擎只能给出"前缀+未识别"，或带拼写建议）
   不进记录——否则记录很快被噪音淹没，复习也没法用。
   词典命中（enhanced/oxford/ecdict）一律记；builtin（规则引擎兜底，即四本词典都没有的词）过两道闸：
   ① 带拼写建议 = 应用自己都认为拼错了（seperate/corhearent/cardivascular）；
   ② 只有前缀没有词根（asdfgh→as+??dfgh、foobar→??foob）——引擎兜底拆不出词根就是没拆出东西。 */
function worthRecording(r) {
  if (!r.found) return false;
  if (r.source !== 'builtin') return true;
  if (r.suggestion && r.suggestion !== r.word) return false;
  const b = r.breakdown;
  if (b && b.unknown && !(b.roots || []).length) return false;
  return true;
}

/* 一次性清理（2026-09-15 之前入库的瞎打/拼错词）：按 worthRecording 同一把尺子过一遍历史。
   必须在词典装载完成之后跑（analyze 要查词典），且跑完在 localStorage 打标记、不再重复。
   句子练习条目（kind=ex）和带空格的短语条目不动。
   触发点有两处（装载完成、历史加载完成），谁后到谁负责跑，条件不满足就先退出等下一次。 */
function pruneJunkHistory() {
  try { if (localStorage.getItem(HIST_PRUNED_KEY) === '1') return; } catch (e) { return; }
  if (!DATA_READY || !HISTORY || !HISTORY.length) return;
  try {
    const keep = HISTORY.filter(x =>
      (x.kind === 'ex' || /\s/.test(x.w || '')) ? true : worthRecording(analyze(x.w)));
    if (keep.length !== HISTORY.length) {
      persistHistory(keep);   // 同时写文件与 localStorage，防止下次 merge 复活
      // 列表已经画过了（initHistory 里 render 在清理之前），必须重画一次，否则界面还是旧的、看着像没清掉
      if (reviewState && !reviewState.finished) renderReview(); else renderHistory();
    }
    localStorage.setItem(HIST_PRUNED_KEY, '1');   // 只在成功后打标记
  } catch (e) { /* 清理失败：不打标记，下次启动重试 */ }
}

function saveHistory(r) {
  const h = loadHistory();
  // 按 k 去重（单词条目 k === w）：重查一个词不能把复习进度清零
  const prev = h.find(x => (x.k || x.w) === r.word);
  const rest = h.filter(x => (x.k || x.w) !== r.word);
  const now = Date.now();
  rest.unshift({
    k: r.word, w: r.word, s: historySummary(r), t: now,
    b: prev ? (prev.b || 0) : 0,
    d: (prev && typeof prev.d === 'number') ? prev.d : now + DAY_MS
  });
  persistHistory(rest);
  renderHistory();
}

// 一键导出当前记录（另存一份，用于备份或换电脑迁移）
async function exportHistory() {
  const h = loadHistory();
  if (!h.length) { alert('暂无记录可导出'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), items: h }, null, 2)],
    { type: 'application/json' });
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: '查词记录-' + stamp + '.json',
        types: [{ description: '查词记录 (JSON)', accept: { 'application/json': ['.json'] } }],
      });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return;
    } catch (e) { /* 用户取消则走下方降级下载 */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '查词记录-' + stamp + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

let reviewState = null;   // 复习状态：{list, i, shown, total, done, ok, bad, requeued, finished}
let histPage = 1;         // 历史列表当前页（每页 60 条）

function shuffled(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* 复习入口。all=true 洗牌全部；默认只复习到期的词、按到期先后排。
   没有到期的词就回落到洗牌全部，保证按钮永不空转。 */
function startReview(all) {
  const h = loadHistory().slice();          // 拷贝再动，别打乱权威顺序
  if (!h.length) { renderHistory(); return; }
  let list;
  if (all) list = shuffled(h);
  else {
    const due = dueItems(h).sort((a, b) => (a.d || 0) - (b.d || 0));
    list = due.length ? due : shuffled(h);
  }
  reviewState = { list: list, i: 0, shown: false, total: list.length, done: 0, ok: 0, bad: 0, requeued: 0, finished: false };
  renderReview();
}

/* 评分。这是唯一的推进方式——SRS 里「评分」就是「翻页」。
   队列用 total 冻结分母，补看的卡会让 list 变长，用 list.length 当分母会越复习越多。 */
function gradeCurrent(ok) {
  const s = reviewState;
  if (!s || s.finished) return;
  const cur = s.list[s.i];
  const h = loadHistory();
  const now = Date.now();
  let it = h.find(x => (x.k || x.w) === (cur.k || cur.w));
  if (!it) { it = normHistItem({ k: cur.k, w: cur.w, s: cur.s || '', kind: cur.kind, en: cur.en, zh: cur.zh, t: now }); h.unshift(it); }
  if (ok) {
    it.b = Math.min((it.b || 0) + 1, SRS_DAYS.length - 1);
    it.d = now + SRS_DAYS[it.b] * DAY_MS;
    s.ok++;
  } else {
    it.b = 0;
    it.d = now + DAY_MS;
    s.bad++;
    s.list.push(Object.assign({}, cur, { requeued: true }));   // 塞回队尾，本轮还会再见到（句子卡也保留 kind）
    s.requeued++;
  }
  s.done++;
  s.shown = false;
  persistHistory(h);
  if (s.i < s.list.length - 1) { s.i++; renderReview(); }
  else finishReview();
}

// 一轮结束给个小结，而不是莫名其妙重新洗一遍从头开始
function finishReview() {
  const s = reviewState;
  const el = document.getElementById('history');
  const dues = loadHistory().map(x => x.d).filter(d => typeof d === 'number').sort((a, b) => a - b);
  const nextTxt = dues.length ? new Date(dues[0]).toLocaleDateString('zh-CN') : '—';
  el.innerHTML = '<div class="rev-head">本轮完成<button class="h-btn" data-rev="quit">返回</button></div>' +
    '<div class="review"><div class="rev-word">🎉</div>' +
    '<div class="rev-sum">复习 ' + s.done + ' 张' + (s.requeued ? '（其中补看 ' + s.requeued + ' 张）' : '') + '<br>' +
    '记住 ' + s.ok + ' · 忘了 ' + s.bad + '</div>' +
    '<div class="rev-date">下次到期：' + nextTxt + '</div>' +
    '<div style="margin-top:18px"><button class="rev-btn" data-rev="all">🔀 再复习一轮（全部）</button></div></div>';
  el.classList.add('show');
  s.finished = true;   // 保留对象，让「再复习一轮/返回」按钮还能被复习分支接住
}

/* ---------- 例句挖空自测 ----------
   把例句里的目标词挖掉，先回忆再揭晓，然后照常自评——复用同一套间隔重复。
   句子条目和单词条目共用历史存储，靠 k（去重键）和 kind 区分。 */
function makeSentenceItem(x, ans) {
  const key = 'ex:' + (ans || x.w) + '|' + String(x.en).slice(0, 80);
  const prev = loadHistory().find(y => (y.k || y.w) === key);
  const now = Date.now();
  return {
    k: key, kind: 'ex', w: ans || x.w, ans: ans || x.w, en: x.en, zh: x.zh || '',
    s: x.en,                                   // 历史列表里显示句子本身
    t: now,
    b: prev ? (prev.b || 0) : 0,
    d: (prev && typeof prev.d === 'number') ? prev.d : now + DAY_MS
  };
}

/* 开一轮例句练习。only 传一条就是"只练这句"，不传就用当前这批搜索结果。 */
function startExamplePractice(only) {
  const pool = only ? [only] : exHits.slice(0, 60);
  const deck = [];
  const seen = new Set();
  for (const x of pool) {
    const ans = exFocus(x);
    if (!exFindTarget(x, ans)) continue;       // 句中定位不到目标词的，挖不了空
    const it = makeSentenceItem(x, ans);
    if (seen.has(it.k)) continue;
    seen.add(it.k);
    deck.push(it);
  }
  if (!deck.length) { alert('这批例句里没有可用于挖空的句子（句中找不到目标词形）。'); return; }
  // 先把它们收进历史，等于"加入复习队列"
  const h = loadHistory();
  const incoming = new Map(deck.map(it => [it.k, it]));
  const rest = h.filter(y => !incoming.has(y.k || y.w));
  rest.unshift(...deck);
  persistHistory(rest);
  reviewState = {
    list: deck, i: 0, shown: false, total: deck.length,
    done: 0, ok: 0, bad: 0, requeued: 0, finished: false, mode: 'ex'
  };
  switchTab('query');    // 复习卡渲染在 #history，只有查询 tab 显示它
  renderReview();
}

// 主动回忆闪卡：先只看词，点「显示释义」才露出释义；露出后自评记住/忘了
function renderReview() {
  const el = document.getElementById('history');
  const s = reviewState;
  if (!s || s.finished || !s.list.length) { renderHistory(); return; }
  const cur = s.list[s.i];
  const d = new Date(cur.t);
  const ts = (d.getMonth() + 1) + '-' + d.getDate();
  const head = '<div class="rev-head">已评 ' + s.done + ' / 共 ' + s.total +
    (s.requeued ? '　补看 ' + s.requeued : '') +
    '<span><button class="h-btn" data-rev="all" title="不看排程，洗牌复习全部">🔀 全部</button>' +
    '<button class="h-btn" data-rev="quit">退出</button></span></div>';
  const grades =
    '<div class="rev-nav">' +
    '<button class="rev-btn bad" data-rev="bad" title="档位归零，明天再来；本轮稍后还会再考一次（快捷键 1）">😰 忘了</button>' +
    '<button class="rev-btn ok" data-rev="ok" title="档位 +1，按间隔表排期（快捷键 2）">😎 记住了</button>' +
    '</div>';
  let h = head + '<div class="review">';

  if (cur.kind === 'ex') {
    // 句子卡：揭晓前把目标词挖掉，揭晓后高亮原词并给出中文
    const m = exFindTarget(cur, cur.ans || cur.w);
    let sentence;
    if (s.shown || !m) {
      sentence = hlWord(cur.w, cur.en);
    } else {
      sentence = escapeHtml(decodeEntities(cur.en.slice(0, m.index))) +
        '<span class="cloze"></span>' +
        escapeHtml(decodeEntities(cur.en.slice(m.index + m[0].length)));
    }
    h += '<div class="rev-ex">' + sentence + '</div>';
    h += '<div class="rev-date">' + ts + (cur.b ? ' · 第 ' + (cur.b + 1) + ' 档' : '') + '　例句挖空</div>';
    if (s.shown) {
      h += '<div class="rev-sum"><b>' + escapeHtml(decodeEntities(cur.w)) + '</b>　' +
        escapeHtml(decodeEntities(EN_MODE() ? (summaryFor(cur.w) || cur.zh || '') : (cur.zh || '(暂无中文)'))) + '</div>';
      h += grades;
      h += '<button class="rev-btn" data-rev="full">查这个词的卡片</button>';
    } else {
      h += '<div class="rev-hint">句中缺的是哪个词？想好了再点下方揭晓</div>';
      h += '<button class="rev-btn primary" data-rev="show" title="快捷键：空格">👁 显示答案</button>';
    }
    h += '</div>';
    el.innerHTML = h;
    el.classList.add('show');
    translateDOM(el);   // 句子挖空分支也得过翻译层，否则英文模式下这几张卡还是中文
    return;
  }

  h += '<div class="rev-word"><span>' + escapeHtml(cur.w) + '</span>' +
    '<button class="tts-btn" data-text="' + escapeHtml(cur.w) + '" title="发音">🔊</button></div>';
  h += '<div class="rev-date">' + ts + (cur.b ? ' · 第 ' + (cur.b + 1) + ' 档' : '') + '</div>';
  if (s.shown) {
    h += '<div class="rev-sum">' + escapeHtml(decodeEntities((EN_MODE() ? summaryFor(cur.w) : '') || cur.s || (EN_MODE() ? '(no definition)' : '(暂无释义)'))) + '</div>';
    // 卡壳揭晓的那一瞬间给钩子：三色拆解 + 口诀（有缓存才显示，没有就给「现场编一句」的入口）
    const rv = analyze(cur.w);
    h += reviewMorphHTML(rv);
    h += memoBlockHTML(rv);
    h += grades;
    h += '<button class="rev-btn" data-rev="full">查看完整卡片</button>';
  } else {
    h += '<div class="rev-hint">先回忆这个词的意思，再点下方显示释义</div>';
    h += '<button class="rev-btn primary" data-rev="show" title="快捷键：空格">👁 显示释义</button>';
  }
  h += '</div>';
  el.innerHTML = h;
  el.classList.add('show');
  translateDOM(el);
}

function renderHistory() {
  const el = document.getElementById('history');
  let h = loadHistory();
  if (!h.length) { el.classList.remove('show'); el.innerHTML = ''; return; }

  // 分页：每页 60 条，无限存储后页面不至于过长
  const PER = 60;
  const pages = Math.max(1, Math.ceil(h.length / PER));
  if (histPage > pages) histPage = pages;
  if (histPage < 1) histPage = 1;
  const start = (histPage - 1) * PER;

  const items = h.slice(start, start + PER).map(x => {
    const d = new Date(x.t);
    const ts = (d.getMonth() + 1) + '-' + d.getDate() + ' ' +
      (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
      (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    return '<div class="h-item" data-word="' + escapeHtml(x.w) + '">' +
      '<span class="h-w">' + escapeHtml(x.w) + (x.kind === 'ex' ? '<span class="h-kind">句</span>' : '') + '</span>' +
      '<span class="h-s">' + escapeHtml(decodeEntities(EN_MODE() ? summaryFor(x.w) : x.s)) + '</span>' +
      '<span class="h-t">' + ts + '</span></div>';
  }).join('');

  const pager = pages > 1
    ? '<div class="h-pager">' +
      '<button class="pager-btn" data-page="prev"' + (histPage <= 1 ? ' disabled' : '') + '>‹ 上一页</button>' +
      '<span class="pager-info">' + histPage + ' / ' + pages + '</span>' +
      '<button class="pager-btn" data-page="next"' + (histPage >= pages ? ' disabled' : '') + '>下一页 ›</button>' +
      '</div>' : '';

  const dueN = dueItems(h).length;
  const _hist = '<div class="h-head">查词记录' +
    '<span class="h-n">' + h.length + '</span>' +
    (dueN ? '<span class="h-n due" title="按间隔重复排到的词">待复习 ' + dueN + '</span>' : '') +
    '<button class="h-btn" id="h-shuffle" title="间隔重复：只复习到期的词；没有到期的就洗牌全部">🎲 复习' + (dueN ? ' (' + dueN + ')' : '') + '</button>' +
    '<button class="h-btn" id="h-export">导出</button>' +
    '<span class="h-btn" style="opacity:.55;cursor:default" title="历史自动存入项目目录 history.json">已自动存本地 ✓</span>' +
    '<button class="h-btn" id="h-clear">清空</button></div>' + items + pager;
  el.innerHTML = _hist;
  el.classList.add('show');
  translateDOM(el);
}

// 条目点击统一交给下方 document 级委托（它顺带做了 switchTab('query')）。
document.getElementById('history').addEventListener('click', (e) => {
  // 复习模式（闪卡）：先于普通历史条目处理
  const rev = e.target.closest('[data-rev]');
  if (rev) {
    const a = rev.dataset.rev;
    // 退出/全部重洗与当前是否有复习会话无关，先处理
    if (a === 'quit') { reviewState = null; renderHistory(); return; }
    if (a === 'all') { startReview(true); return; }
    if (!reviewState || reviewState.finished) return;
    if (a === 'show') { reviewState.shown = true; renderReview(); }
    else if (a === 'ok') gradeCurrent(true);
    else if (a === 'bad') gradeCurrent(false);
    else if (a === 'full') { const w = reviewState.list[reviewState.i].w; switchTab('query'); input.value = w; search(); }
    return;
  }
  // 历史分页：上一页/下一页（范围在 renderHistory 内自动钳制）
  const pg = e.target.closest('[data-page]');
  if (pg) {
    if (pg.dataset.page === 'next') histPage++;

  if (e.target.id === 'h-shuffle') { startReview(); return; }
  if (e.target.id === 'h-export') { exportHistory(); return; }
  if (e.target.id === 'h-clear' && confirm('确定清空全部查词记录吗？')) {
    HISTORY = [];
    try { localStorage.removeItem(HIST_KEY); } catch (e2) {}

const KOKORO_URL = 'http://127.0.0.1:8757';
const KOKORO_VOICES = [
  ['af_heart', '美音·女·Heart'], ['af_bella', '美音·女·Bella'], ['af_nicole', '美音·女·Nicole'],
  ['af_aoede', '美音·女·Aoede'], ['af_kore', '美音·女·Kore'],

// 内置浏览器语音
function speakBuiltin(text, rate, onEnd) {
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ttsBuiltinLang;
  u.rate = rate;
  if (onEnd) u.onend = onEnd;
  speechSynthesis.speak(u);
}

// Kokoro 高音质：请求本地 TTS 服务合成并播放
async function speakKokoro(text, speed, onEnd) {
  const r = await fetch(KOKORO_URL + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, voice: ttsKokoroVoice, speed: speed || ttsSpeed })
  });
  if (!r.ok) throw new Error('TTS ' + r.status);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = new Audio(url);
  a.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
  await a.play();
}

// 统一入口：按当前引擎播放，Kokoro 失败时静默回退内置语音。
// speed 可选——只在「慢速朗读」快捷键（Shift+空格）时传，不写入设置。
// onEnd 可选——播放真正结束时回调（发音按钮的呼吸动画靠它收尾，别再用写死的定时器：
// 单词 0.5 秒、长例句 5 秒，一个固定值必然对不上）。
function speakText(text, speed, onEnd) {
  text = decodeEntities(text);   // 还原 &#x27;/&quot; 等实体，朗读才跟原文一致
  const sp = speed || ttsSpeed;
  if (ttsEngine === 'kokoro' && kokoroOk) {
    speakKokoro(text, sp, onEnd).catch(() => speakBuiltin(text, sp, onEnd));
  } else {
    speakBuiltin(text, sp, onEnd);
  }
}
// 朗读当前卡片上的词（快捷键用）：卡片里的发音按钮带 data-w，直接借它取词

  const btn = document.querySelector('#result .tts-btn[data-w]');

  if (w) speakText(w, slow ? 0.6 : undefined);
}

/* 💡 AI 助记：点击后流式读 /memo（本地 Ollama，CPU 推理约 2-4 秒），边生成边显示 */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.memo-btn');
  if (!btn || btn.disabled) return;
  const box = btn.parentElement.querySelector('.memo-box');
  if (!box) return;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '💡 生成中…';
  box.hidden = false;
  box.textContent = '本地模型思考中（约 2-4 秒）…';
  try {
    const resp = await fetch('/memo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        word: btn.dataset.memo, morph: btn.dataset.morph, meaning: btn.dataset.meaning,
        // 与界面语言相反：中文界面出英文口诀、英文界面出中文口诀（实时读，切了语言也准）
        lang: EN_MODE() ? 'zh' : 'en'
      })
    });
    if ((resp.headers.get('content-type') || '').includes('json')) {
      const j = await resp.json().catch(() => ({}));
      box.innerHTML = '<span class="memo-err">生成失败：' + escapeHtml(j.err || '未知错误') + '</span>';
      btn.textContent = label;
    } else {
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let acc = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        acc += dec.decode(value, { stream: true });
        box.textContent = acc;   // 流式期间保持纯文本：逐字重排 DOM 会闪
      }
      if (acc.trim()) {
        const lang = EN_MODE() ? 'zh' : 'en';
        box.innerHTML = memoTextHTML(acc, lang);   // 出完再切词，英文助记的词就能点开拆解了
        saveMemo(btn.dataset.memo, lang, acc);
        btn.textContent = '💡 重新生成';
      } else {
        box.innerHTML = '<span class="memo-err">模型没有返回内容</span>';
        btn.textContent = label;
      }
    }
  } catch (err) {
    box.innerHTML = '<span class="memo-err">请求失败：' + escapeHtml(err.message || String(err)) + '</span>';
    btn.textContent = label;
  }
  btn.disabled = false;
});

    return;
  }
  // Alt+← 在 Windows 上是浏览器后退键，preventDefault 未必拦得住，
  // 所以同时支持 Alt+[ 作为等价快捷键
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === '[')) {
    // 这里刻意不拦输入框：Alt 组合键不会干扰正常打字，而搜索框是 autofocus，
    // 一旦在这里 return，就等于"最常见的状态下这个快捷键完全没反应"。
    e.preventDefault();
    navBack();
    return;
  }
  /* 空格：复习中=显示答案（揭晓后交给 1/2 评分，空格不再动作防误评）；
     平时=朗读当前卡片上的词，Shift+空格慢速。拦掉默认滚动，否则长卡片会跟着跳。 */
  if (e.code === 'Space' && !isTyping(e.target)) {
    e.preventDefault();
    if (reviewState && !reviewState.finished) {
      if (!reviewState.shown) { reviewState.shown = true; renderReview(); }
      return;
    }
    speakCurrentWord(e.shiftKey);
    return;
  }
  // Enter：复习中未揭晓时显示答案（揭晓后无动作，避免与搜索框回车混淆）
  if (e.key === 'Enter' && !isTyping(e.target) && reviewState && !reviewState.finished && !reviewState.shown) {
    e.preventDefault();
    reviewState.shown = true;
    renderReview();
    return;
  }
  // 1 / 2：复习自评（1=忘了，2=记住了），只在复习会话里生效
  if ((e.key === '1' || e.key === '2') && !isTyping(e.target) && reviewState && !reviewState.finished) {
    e.preventDefault();
    gradeCurrent(e.key === '2');
    return;
  }
  // [ / ]：上一个 / 下一个查过的词（Alt+[ 是同一个回退动作的老写法，保留兼容）。
  // 刻意不判 isTyping：查词框里不会输入方括号，而判了就等于 autofocus 期间永不触发。
  if (e.key === '[' || e.key === ']') {
    e.preventDefault();
    if (e.key === '[') navBack(); else navForward();
    return;
  }
  if (e.key === '/' && !isTyping(e.target)) {
    e.preventDefault();
    switchTab('query');
    input.focus();
    input.select();
  }
});

input.addEventListener('drop', (e) => {
  e.preventDefault();
  input.classList.remove('drag-over');
  const txt = (e.dataTransfer.getData('text') || '').trim();
  if (txt) {
    input.value = txt;
    search();   // 拖入即分析，无需再点"分析"
  }
});

</script>
</body>
</html>
