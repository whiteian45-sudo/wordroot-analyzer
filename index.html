<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根词缀分析器</title>
<style>
  :root {
    /* 液态玻璃色板 */
    --glass-bg: #0a0c18;
    --glass-card: rgba(255,255,255,0.07);
    --glass-card-strong: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.14);
    --glass-border-hi: rgba(255,255,255,0.28);
    --text: #f2f4ff;
    --sub: rgba(242,244,255,0.55);
    --accent: #6ea8ff;
    --accent-soft: rgba(110,168,255,0.14);
    --ok: #7ee2a8;
    --gold: #ffd479;
    --gold-soft: rgba(255,212,121,0.16);
    --shadow: 0 12px 40px rgba(0,0,0,0.45);
    --blur: blur(28px) saturate(150%);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background:
      radial-gradient(900px 700px at 8% 0%, rgba(94,110,255,0.28), transparent 60%),
      radial-gradient(800px 600px at 92% 8%, rgba(180,80,255,0.22), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(0,200,255,0.18), transparent 60%),
      radial-gradient(600px 500px at 80% 60%, rgba(255,140,120,0.14), transparent 60%),
      var(--glass-bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 48px 16px 60px;
  }
  /* 顶部光晕装饰 */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(500px 320px at 70% 12%, rgba(255,255,255,0.08), transparent 70%),
      radial-gradient(400px 260px at 20% 85%, rgba(120,180,255,0.10), transparent 70%);
    filter: blur(60px);
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .brand-badge {
    width: 58px; height: 58px; border-radius: 18px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-card-strong);
    border: 1px solid var(--glass-border-hi);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 24px rgba(0,0,0,0.35);
  }
  .brand-badge svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }
  .brand h1 {
    font-size: 30px; font-weight: 800; margin: 0; letter-spacing: .3px;
    background: linear-gradient(135deg, #fff, rgba(255,255,255,0.72));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand .subtitle { color: var(--sub); font-size: 13px; margin: 5px 0 0; }
  .search { width: 100%; max-width: 560px; display: flex; gap: 10px; position: relative; z-index: 1; }
  .search input {
    flex: 1; padding: 14px 20px; font-size: 16px; border-radius: 16px;
    border: 1px solid var(--glass-border);
    background: var(--glass-card);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    color: var(--text); outline: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    transition: border-color .2s, background .2s;
  }
  .search input::placeholder { color: rgba(242,244,255,0.35); }
  .search input:focus { border-color: var(--glass-border-hi); background: var(--glass-card-strong); }
  .search input.drag-over { border-color: var(--glass-border-hi); background: var(--glass-card-strong); box-shadow: 0 0 0 3px rgba(92,141,255,0.35); }
  .search button {
    padding: 0 26px; font-size: 15px; font-weight: 600; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #5c8dff, #7a5cff);
    color: #fff; cursor: pointer; box-shadow: 0 6px 20px rgba(92,141,255,0.35);
    transition: transform .15s, box-shadow .15s, filter .15s;
    position: relative; overflow: hidden;
  }
  /* 悬停时一束斜光扫过按钮，像被擦亮 */
  .search button::after {
    content: ''; position: absolute; top: 0; left: -80%; width: 45%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg); pointer-events: none;
    transition: left .55s ease;
  }
  .search button:hover::after { left: 130%; }
  .search button:hover { box-shadow: 0 8px 26px rgba(92,141,255,0.5); }
  .search button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .search button:active { transform: translateY(0); }
  .result { width: 100%; max-width: 560px; margin-top: 26px; display: none; position: relative; z-index: 1; }
  .result.show { display: block; }
  .card {
    background: var(--glass-card);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-radius: 22px; padding: 22px 24px; margin-bottom: 16px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.09);
    animation: cardIn .5s cubic-bezier(.2,.7,.2,1) backwards;
    transition: transform .25s, border-color .25s, box-shadow .25s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--glass-border-hi); }
  .word-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .word { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .badge {
    font-size: 12px; padding: 4px 12px; border-radius: 30px;
    background: var(--accent-soft); border: 1px solid rgba(110,168,255,0.25);
    color: var(--accent); backdrop-filter: blur(8px);
  }
  .badge.enhanced { color: var(--ok); border-color: rgba(126,226,168,0.3); background: rgba(126,226,168,0.12); }
  .breakdown { display: flex; align-items: stretch; gap: 6px; margin: 18px 0 4px; flex-wrap: wrap; }
  .morph {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border-radius: 14px; padding: 9px 14px;
    background: var(--glass-card-strong); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
  }
  .morph b { font-size: 17px; letter-spacing: .5px; }
  .morph .m { color: var(--sub); font-size: 12px; max-width: 130px; text-align: center; overflow-wrap: anywhere; }
  .plus { color: var(--sub); font-size: 18px; align-self: center; padding-bottom: 0; }
  .breakdown:has(> .morph:only-child) { justify-content: center; }
  .breakdown:has(> .morph:only-child) .morph { flex: 0 1 auto; }
  .meaning { margin-top: 14px; line-height: 1.7; font-size: 14px; }
  .meaning .label { color: var(--sub); font-size: 12px; letter-spacing: .4px; margin-bottom: 5px; }
  .eq { color: var(--accent); font-weight: 600; }
  .cognates { margin-top: 14px; }
  .cognates .tag {
    display: inline-block; margin: 3px 6px 3px 0; padding: 4px 12px;
    background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 18px;
    font-size: 13px; color: var(--text); backdrop-filter: blur(8px);
  }
  .miss { color: var(--sub); font-size: 14px; line-height: 1.8; }
  .ex {
    margin-top: 7px; padding: 9px 12px; background: var(--glass-card);
    border: 1px solid var(--glass-border); border-radius: 12px; font-size: 13px; color: var(--sub);
  }
  .ex-en { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--text); line-height: 1.6; }
  .ex-en-txt { flex: 1; }
  .def-line { margin-top: 6px; }
  .def-line:first-of-type { margin-top: 0; }
  .ex-zh { font-size: 13px; color: var(--sub); line-height: 1.6; margin-top: 3px; }
  .ex-tts { padding: 2px 8px; font-size: 12px; flex: none; margin-top: 1px; }
  /* 词源演变链：圆点+竖线的时间线，每个词素一个发光节点，逐个点亮 */
  .chain { margin-top: 14px; }
  .chain-item {
    position: relative; display: flex; align-items: center; flex-wrap: wrap;
    gap: 8px; padding: 7px 0 7px 34px;
  }
  /* 发光圆点节点 */
  .chain-item::after {
    content: ''; position: absolute; left: 11px; top: 15px; width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a8c8ff, var(--accent));
    box-shadow: 0 0 8px rgba(110,168,255,0.55), inset 0 0 2px rgba(255,255,255,0.45);
    animation: dotIn .45s cubic-bezier(.2,.7,.2,1) both;
    animation-delay: calc(.3s + var(--i, 0) * .15s);
  }
  /* 节点之间的连接竖线 */
  .chain-item::before {
    content: ''; position: absolute; left: 15px; top: 30px; bottom: -14px; width: 2px;
    background: linear-gradient(to bottom, rgba(110,168,255,0.35), rgba(110,168,255,0.04));
    border-radius: 2px;
  }
  .chain-item:last-child::before { display: none; }
  .chain-morph {
    font-weight: 600; color: var(--accent); font-size: 13.5px;
    background: var(--accent-soft); border: 1px solid rgba(110,168,255,0.22);
    border-radius: 8px; padding: 2px 9px;
  }
  .chain-arrow { color: var(--sub); font-size: 13px; }
  .chain-src { font-size: 13px; color: var(--text); }
  .chain-src .lang { color: var(--ok); font-weight: 600; margin-right: 4px; }
  .chain-src .w { font-style: italic; margin-right: 4px; }
  .chain-src .note { color: var(--sub); font-size: 12px; }
  .chain-nosrc { color: var(--sub); font-size: 13px; }
  .chain-meaning { color: var(--sub); font-size: 12px; }
  /* 同源词/同根词标签云 */
  .cog {
    display: inline-block; margin: 3px 6px 3px 0; padding: 4px 12px;
    background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 18px;
    font-size: 13px; color: var(--text); cursor: pointer; backdrop-filter: blur(8px);
    transition: border-color .15s, color .15s, background .15s;
  }
  .cog:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .cog-row { margin: 5px 0; font-size: 13px; color: var(--sub); }
  .cog-row .cog-lbl { color: var(--accent); font-weight: 600; }
  /* 段落阅读模式 */
  .para { line-height: 2.3; font-size: 16px; }
  .ptok { display: inline-block; cursor: pointer; border-bottom: 1px dashed rgba(110,168,255,0.4); transition: color .15s; }
  .ptok:hover { color: var(--accent); }
  /* 右侧滑出面板 */
  .panel-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 99;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .panel-mask.show { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 92vw;
    transform: translateX(105%); transition: transform .3s ease; z-index: 100;
    background: rgba(12,14,28,0.9); backdrop-filter: blur(32px) saturate(150%);
    -webkit-backdrop-filter: blur(32px) saturate(150%);
    border-left: 1px solid var(--glass-border);
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
  }
  .panel-title { font-weight: 700; font-size: 16px; }
  .panel-close {
    border: 1px solid var(--glass-border); background: var(--glass-card); color: var(--sub);
    border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px);
    transition: all .15s;
  }
  .panel-close:hover { color: var(--text); border-color: var(--glass-border-hi); }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .panel-body .card { max-width: none; }
  /* 收藏按钮 */
  .fav-btn {
    margin-left: auto; border: 1px solid var(--glass-border); background: var(--glass-card);
    color: var(--sub); border-radius: 20px; padding: 5px 14px; font-size: 13px;
    cursor: pointer; align-self: center; backdrop-filter: blur(8px);
    transition: all .15s;
  }
  .fav-btn:hover { border-color: var(--gold); color: var(--gold); }
  .fav-btn.on { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  /* 发音按钮 */
  .tts-btn {
    border: 1px solid var(--glass-border); background: var(--glass-card);
    color: var(--sub); border-radius: 20px; padding: 5px 12px; font-size: 13px;
    cursor: pointer; align-self: center; backdrop-filter: blur(8px);
    transition: all .15s; line-height: 1;
  }
  .tts-btn:hover { color: var(--accent); border-color: var(--accent); }
  .tts-btn.playing { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); animation: tts-pulse 1s ease-in-out infinite; }
  @keyframes tts-pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  /* 疑似拼写错误提示 */
  .spell-suggest {
    margin: 4px 0 10px; padding: 8px 12px; font-size: 13px; color: var(--text);
    border: 1px solid rgba(255, 200, 80, 0.35); border-radius: 10px;
    background: rgba(255, 200, 80, 0.08); backdrop-filter: blur(6px);
  }
  .spell-suggest .cog { border-color: rgba(255,200,80,0.5); color: var(--gold); }
  /* 发音工具条 */
  .tts-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    width: 100%; max-width: 560px; margin-top: 12px; position: relative; z-index: 1;
    font-size: 13px; color: var(--sub);
  }
  .tts-bar .tts-label { font-size: 12px; opacity: .8; }
  .tts-eng {
    border: 1px solid var(--glass-border); background: var(--glass-card); color: var(--sub);
    border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px);
    transition: all .15s;
  }
  .tts-eng:hover { color: var(--accent); border-color: var(--accent); }
  .tts-eng.active { color: #fff; border-color: rgba(110,168,255,0.5); background: linear-gradient(135deg, rgba(92,141,255,0.4), rgba(122,92,255,0.4)); }
  .tts-bar select {
    border: 1px solid var(--glass-border); background: var(--glass-card); color: var(--text);
    border-radius: 10px; padding: 4px 6px; font-size: 12px; backdrop-filter: blur(8px); cursor: pointer;
  }
  .tts-bar select option { background: #1a1e2e; }
  .tts-hint { font-size: 11px; opacity: .65; }
  /* 段落朗读按钮 */
  .para-head { margin-bottom: 10px; }
  /* Tab 导航 */
  .tabs { display: flex; gap: 8px; width: 100%; max-width: 560px; margin-top: 22px; position: relative; z-index: 1; }
  .tab {
    flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 500;
    border: 1px solid var(--glass-border); border-radius: 14px;
    background: var(--glass-card); backdrop-filter: var(--blur);
    color: var(--sub); cursor: pointer; transition: all .2s;
  }
  .tab:hover { color: var(--accent); border-color: var(--accent); }
  .tab.active {
    background: linear-gradient(135deg, rgba(92,141,255,0.35), rgba(122,92,255,0.35));
    color: #fff; border-color: rgba(110,168,255,0.4); box-shadow: 0 4px 16px rgba(92,141,255,0.25);
  }
  /* Tab 滑动指示条：一条发光的渐变线，在两个标签间滑动 */
  .tab-ind {
    position: absolute; bottom: -1px; left: 0; height: 3px; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, #5c8dff, #7a5cff);
    box-shadow: 0 0 10px rgba(110,168,255,0.6);
    transition: left .28s cubic-bezier(.2,.7,.2,1), width .28s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .tip { color: var(--sub); font-size: 12px; margin-top: 16px; text-align: center; position: relative; z-index: 1; }
  #history { width: 100%; max-width: 560px; margin-top: 22px; display: none; position: relative; z-index: 1; }
  #history.show { display: block; }
  #favlist { width: 100%; max-width: 560px; margin-top: 22px; position: relative; z-index: 1; }
  .h-head { display: flex; align-items: center; gap: 8px; color: var(--sub); font-size: 13px; margin-bottom: 8px; }
  .h-n { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 0 8px; font-size: 12px; }
  .h-btn { border: 1px solid var(--glass-border); background: var(--glass-card); color: var(--sub); border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px); transition: color .15s; }
  .h-btn:hover { color: var(--text); }
  .h-btn:disabled { opacity: .55; cursor: default; }
  #h-clear { margin-left: auto; }
  .h-item { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-size: 13px; transition: background .15s; }
  .h-item:hover { background: var(--glass-card); }
  .h-w { font-weight: 600; color: var(--accent); min-width: 90px; }
  .h-s { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
  .h-t { color: var(--sub); font-size: 12px; flex-shrink: 0; }
  .fav-rm { color: var(--sub); cursor: pointer; padding: 0 4px; font-size: 12px; }
  .fav-rm:hover { color: var(--gold); }
  /* 收藏列表里的词条容器也玻璃化 */
  .favlist .h-item { border: 1px solid var(--glass-border); margin-bottom: 8px; background: var(--glass-card); backdrop-filter: blur(12px); }

  /* ===== 动效关键帧 ===== */
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes dotIn  { from { opacity: 0; transform: scale(.4); }  to { opacity: 1; transform: scale(1); } }

  /* 系统开启"减弱动态效果"时关掉装饰性动画，照顾偏好 */
  @media (prefers-reduced-motion: reduce) {
    .card, .chain-item::after { animation: none; }
    .search button::after, .tab-ind { transition: none; }
  }
</style>
</head>
<body>

<div class="brand">
  <div class="brand-badge" title="前缀 · 词根 · 后缀">
    <svg width="30" height="22" viewBox="0 0 30 22" fill="none">
      <rect x="0" y="7" width="8" height="8" rx="4" fill="#6ea8ff"/>
      <rect x="9.5" y="3" width="11" height="16" rx="5" fill="#ffd479"/>
      <rect x="22" y="9" width="6" height="5" rx="2.5" fill="#7ee2a8"/>
    </svg>
  </div>
  <div class="brand-text">
    <h1>词根词缀分析器</h1>
    <div class="subtitle">输入一个英文单词，拆出它的前缀 / 词根 / 后缀</div>
  </div>
</div>

<div class="search">
  <input id="input" type="text" placeholder="输入单词，如 transport" autofocus spellcheck="false">
  <button id="btn">分析</button>
</div>

<div id="load-tip" class="tip">正在加载词库…</div>

<div class="tts-bar" id="tts-bar">
  <span class="tts-label">发音</span>
  <button class="tts-eng active" data-eng="builtin" title="浏览器自带，即点即播">内置</button>
  <button class="tts-eng" data-eng="kokoro" title="Kokoro 高音质，需 TTS 服务在运行">Kokoro</button>
  <select id="tts-voice" title="声音"></select>
  <select id="tts-speed" title="语速">
    <option value="0.75">慢</option>
    <option value="1" selected>正常</option>
    <option value="1.25">稍快</option>
    <option value="1.5">快</option>
  </select>
  <span class="tts-hint" id="tts-hint"></span>
</div>

<div class="tabs">
  <button class="tab active" data-tab="query">查询</button>
  <button class="tab" data-tab="fav">收藏</button>
  <span class="tab-ind" id="tab-ind"></span>
</div>

<div class="panel-mask" id="panel-mask"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <span class="panel-title" id="panel-title">详细</span>
    <button class="panel-close" id="panel-close">✕ 关闭</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<div class="result" id="result"></div>
<div id="history"></div>
<div id="favlist" class="favlist" style="display:none"></div>

<script id="core">
/* ============================================================
   数据区：内置词根词缀表（离线可用）
   增强词表挂载点：{} 会被导入脚本替换为 JSON
   ============================================================ */

/* 前缀表：前缀 -> 含义 */
const PREFIXES = {
  "a": "不、无",
  "ab": "离开、脱离",
  "ad": "朝向、加强",
  "ac": "朝向(ad的变体)",
  "af": "朝向(ad的变体)",
  "ag": "朝向(ad的变体)",
  "al": "朝向(ad的变体)",
  "an": "朝向(ad的变体)",
  "ap": "朝向(ad的变体)",
  "ar": "朝向(ad的变体)",
  "as": "朝向(ad的变体)",
  "at": "朝向(ad的变体)",
  "ambi": "两者、周围",
  "ante": "在…之前",
  "anti": "反对、相反",
  "astro": "星、天体",
  "auto": "自己、自动",
  "be": "使…、加以",

/* 增强词表：word -> 该词的现成分解（由导入脚本注入，未注入时为 { }） */
const ENHANCED = {};
const ECDICT = {};          // 全量词典，运行时从 ecdict.json 加载
let DATA_READY = false;     // 数据是否加载完成;

/* ============================================================
   算法：贪心切分
   ============================================================ */

function buildLists() {
  const prefixes = Object.entries(PREFIXES).sort((a, b) => b[0].length - a[0].length);
  const suffixes = Object.entries(SUFFIXES).sort((a, b) => b[0].length - a[0].length);
  return { prefixes, suffixes };
}
const LISTS = buildLists();

/* ============================================================
   同源词 / 同根词 索引（运行时构建，不占数据体积）
   同源词：按 词源来源(语言+原词) 分组，如 corpus ← 拉丁语 corpus → corporate/corps
   同根词：按 词素(词根) 分组，如 port → export/import/transport
   ============================================================ */
const SRC_INDEX = new Map();    // key: 语言+原词 -> Set(单词)
const MORPH_INDEX = new Map();  // key: 词素 -> Set(单词)
const MORPH_SRC = {};           // 词素 -> {lang, word, note} 词根来源（用于全量词补演变链）
const SUFFIX_KEYS = new Set(Object.keys(SUFFIXES));
function buildIndex() {
  SRC_INDEX.clear();
  MORPH_INDEX.clear();
  // 词根表例词也加入索引：port -> export/import/transport
  for (const [root, val] of Object.entries(ROOTS)) {
    if (root.length < 2 || !Array.isArray(val)) continue;
    const ex = val[1];
    if (!Array.isArray(ex)) continue;
    if (!MORPH_INDEX.has(root)) MORPH_INDEX.set(root, new Set());
    ex.forEach(w => { if (w) MORPH_INDEX.get(root).add(w); });
  }
  for (const [w, e] of Object.entries(ENHANCED)) {
    if (!e.chain) continue;
    for (const m of e.chain) {
      const src = m.source;
      if (src && src.lang && src.word) {
        const key = src.lang + '\u0001' + src.word;
        if (!SRC_INDEX.has(key)) SRC_INDEX.set(key, new Set());
        SRC_INDEX.get(key).add(w);
      }
      const mm = m.m;
      if (mm && mm.length >= 2 && !SUFFIX_KEYS.has(mm)) {
        if (!MORPH_INDEX.has(mm)) MORPH_INDEX.set(mm, new Set());
        MORPH_INDEX.get(mm).add(w);
      }
      if (src && src.lang && src.word && mm) {
        // 过滤占位来源：word 含"后缀"字样的是词源数据凑数占位（如 market 的 et→"拉丁语 后缀"），
        // 不是真实词源词形，塞进 MORPH_SRC 会让演变链显示"et←拉丁语 后缀"这类怪结果
        if (src.word.includes('后缀')) continue;
        if (!MORPH_SRC[mm]) MORPH_SRC[mm] = { lang: src.lang, word: src.word, note: src.note || '', meaning: m.meaning || '' };
        else if (!MORPH_SRC[mm].meaning && m.meaning) MORPH_SRC[mm].meaning = m.meaning;
      }
    }
  }
}


/* 查询某词的 同源词/同根词 */
function findCognates(word) {
  const e = ENHANCED[word];
  const srcs = [];
  const morphs = [];
  const seenMorph = new Set();
  // 全量词/表外词：用规则引擎拆解，查同根词（完整拆解失败退回部分拆解，如 binary→bi）
  if (!e || !e.chain) {
    const bd = decompose(word, 0) || partialDecompose(word);
    if (bd) {
      const allRoots = (bd.roots || []).map(r => r.m);
      // 前缀也参与同根查询（如 binary 的 bi-、automatic 的 auto-）
      if (bd.prefix) allRoots.push(bd.prefix.m.replace(/-.*$/, ''));
      for (const rm of allRoots) {
        if (rm.length < 2 || seenMorph.has(rm)) continue;
        seenMorph.add(rm);
        const mates = MORPH_INDEX.get(rm);
        if (mates) {
          const list = [...mates].filter(x => x !== word);
          if (list.length) morphs.push({ m: rm, words: list });
        }
      }
    }
    return { srcs, morphs };
  }
  if (e && e.chain) {
    for (const m of e.chain) {
      const src = m.source;
      if (src && src.lang && src.word) {
        const key = src.lang + '\u0001' + src.word;
        const mates = SRC_INDEX.get(key);
        if (mates) {
          const list = [...mates].filter(x => x !== word);
          if (list.length) srcs.push({ lang: src.lang, word: src.word, words: list });
        }
      }
      const mm = m.m;
      if (mm && mm.length >= 2 && !SUFFIX_KEYS.has(mm)) {
        const mates = MORPH_INDEX.get(mm);
        if (mates) {
          const list = [...mates].filter(x => x !== word);
          if (list.length) morphs.push({ m: mm, words: list });
        }
      }
    }
  }
  return { srcs, morphs };
}

const BASE_PREFIXES = {};

    const p = bw.slice(0, 2);
    (BASE_PREFIXES[p] = BASE_PREFIXES[p] || []).push(bw);
  }
}

const WHOLE_ONLY = {

   和内部 trop 撞车词，强制不用 troph/trop 词根（见 decompose 中的过滤） */

  'astrophorous',

  'retropatellar'
]);

/* in-/im- 前缀含义消歧：词根含"向内/进入"语义 → 向内；否则 → 不、无 */
const IN_INTO = { port:1, ject:1, spect:1, sist:1, spir:1, press:1, cur:1, curs:1, gress:1, flu:1, quest:1, tend:1, trus:1, cept:1, vent:1, duc:1 };
const IN_NOT = { vis:1, vari:1, fin:1, finit:1, sens:1, correct:1, direct:1, definite:1, legal:1, accurate:1, credible:1, mobile:1, mortal:1, sane:1, human:1, sufficient:1, efficient:1, convenient:1, significant:1, distinct:1, flexible:1, separable:1, conceiv:1, capable:1, formal:1 };

/* 英语基本词变形还原：happi→happy，creat→create
   深度限制：只有"直接命中"在任意深度生效；去y/补e/双写等变形还原
   仅允许在剥切深度 ≤1（即整词或剥一个词缀后）——英语"动词去e+后缀"
   派生是单层的（argue+ment、arrive+al），深层递归出现的基本词
   多为无关凑巧（如 application 深处 appl→apple），应禁止顶替真词根。 */
function baseRoot(seg, depth) {
  if (BASEWORDS[seg]) return { m: seg, meaning: BASEWORDS[seg] };
  if (depth > 1) return null;
  // flex 标记：变形还原得到的词根（去y/补e/双写），评分时额外罚分，
  // 避免在存在真词根竞争时顶替（如 apply 的 appl→apple，应拆 ap-+ply）
  if (seg.endsWith('i')) {
    const y = seg.slice(0, -1) + 'y';
    if (BASEWORDS[y]) return { m: y, meaning: BASEWORDS[y], flex: true };
  }
  // 补 e 还原只对 ≥3 字母做：2 字母词补 e 会误伤基本词（to→toe、us→use、do→doe、be→bee）
  if (seg.length >= 3 && BASEWORDS[seg + 'e']) return { m: seg + 'e', meaning: BASEWORDS[seg + 'e'], flex: true };
  if (seg.length >= 4 && seg[seg.length - 1] === seg[seg.length - 2]) {
    const d = seg.slice(0, -1);
    if (BASEWORDS[d]) return { m: d, meaning: BASEWORDS[d], flex: true };
  }
  // -ing/-er 变形还原：nosing→nose、licking→lick、licker→lick、running→run
  // 三种形态：去 ing/er 后直接命中（look+ing→looking）、去双写（run+ning→running）、去 ing/er 补 e（nose+ing→nosing）
  // dropped 记录剥掉的变形后缀，供 decompose 第 0 步补回 suffixes（teacher→teach+er，不再丢 -er）
  if (seg.length >= 4 && (seg.endsWith('ing') || seg.endsWith('er'))) {
    const dropped = seg.endsWith('ing') ? 'ing' : 'er';
    const stem = seg.slice(0, seg.endsWith('ing') ? -3 : -2);
    const hits = [];
    if (BASEWORDS[stem]) hits.push(stem);
    const dedup = stem.slice(0, -1);
    if (stem.length >= 2 && stem[stem.length - 1] === stem[stem.length - 2] && BASEWORDS[dedup]) hits.push(dedup);
    if (BASEWORDS[stem + 'e']) hits.push(stem + 'e');
    if (hits.length) return { m: hits[0], meaning: BASEWORDS[hits[0]], flex: true, dropped };
  }
  return null;
}

/* 统一词根查询：拉丁词根 > 英语基本词(含变形还原)
   isBase 标记：命中基本词表/整词表/变形还原的词，拆解评分时长度不计，
   避免基本词在复合拆解中压过"真前缀+真词根"（如 complete 不被拆成 come+plete）。 */
function rootOf(seg, depth) {
  if (BASEWORD_OVERRIDE[seg]) return { ...BASEWORD_OVERRIDE[seg], isBase: true };
  if (WHOLE_ONLY[seg]) return { m: seg, meaning: WHOLE_ONLY[seg], cognates: [], isBase: true };
  if (ROOTS[seg]) return { m: seg, meaning: ROOTS[seg][0], cognates: ROOTS[seg][1] || [] };
  const b = baseRoot(seg, depth);
  return b ? { m: b.m, meaning: b.meaning, cognates: [], isBase: true, flex: !!b.flex, dropped: b.dropped } : null;
}

/* 前缀含义（含 in-/im- 消歧） */
function prefMeaning(pf, rootM) {
  if (!rootM) return pf.meaning;
  const k = pf.m === 'im' ? 'in' : pf.m;
  if (k === 'in') {
    if (IN_INTO[rootM]) return '向内、进入';
    if (IN_NOT[rootM]) return '不、无';
  }
  return pf.meaning;
}

/* ============================================================
   算法：递归拆解
   支持：前缀+词根+后缀、多层前缀(mis+under+stand)、
         英语复合词(news+paper)、基本词+后缀(teach+er)
   ============================================================ */
function decompose(w, depth) {
  if (w.length < 2 || depth > 4) return null;
  let candidates = [];

  // 0. 整段本身是词根/基本词
  const whole = rootOf(w, depth);
  if (whole) {
    // flex 变形还原剥掉了 -er/-ing 后缀（teacher→teach+er），补回 suffixes 避免丢后缀
    if (whole.flex && whole.dropped && LISTS.suffixes.some(s => s[0] === whole.dropped)) {
      return { prefix: null, roots: [whole], suffixes: [{ m: whole.dropped, meaning: LISTS.suffixes.find(s => s[0] === whole.dropped)[1] }] };
    }
    return { prefix: null, roots: [whole], suffixes: [] };
  }

  // 1. 前缀 + 递归拆剩余部分
  for (const [pre, preM] of LISTS.prefixes) {
    if (!w.startsWith(pre)) continue;
    // 整词以某个"更长的基本词"开头时，禁止剥前缀
    // （apple-polish 的 apple 是基本词，不能被 ap- 吃掉拆成 ap+pple-polish）
    if (w.length > pre.length) {
      let blocked = false;
      for (const bw of BASE_PREFIXES[pre] || []) {
        if (w.startsWith(bw)) { blocked = true; break; }
      }
      if (blocked) continue;
    }
    const rest = w.slice(pre.length);
    if (rest.length < 2) continue;
    const sub = decompose(rest, depth + 1);
    if (!sub) continue;
    const rootLen = sub.roots.reduce((n, r) => n + (r.isBase ? 0 : r.m.length), 0);
    // 子拆解里已有前缀时，合并显示为"双前缀"(如 mis-under)
    const prefix = sub.prefix
      ? { m: pre + '-' + sub.prefix.m, meaning: preM + '；' + sub.prefix.meaning }
      : { m: pre, meaning: preM };
    candidates.push({
      prefix: prefix,
      roots: sub.roots,
      suffixes: sub.suffixes,
      score: rootLen * 2 + pre.length * 0.2 - (sub.roots.length + sub.suffixes.length) * 14 + sub.suffixes.length * 9 - (sub.roots.some(r => r.flex) ? 6 : 0)
    });
  }

  // 2. 剥后缀（可连续多个），递归拆剩余部分
  for (const [suf, sufM] of LISTS.suffixes) {
    if (!w.endsWith(suf) || w.length - suf.length < 2) continue;
    const rest = w.slice(0, w.length - suf.length);
    // 弱后缀(s/es/e)只允许直接接在整词词根后，避免过度拆分(如 revers→rever+s 假拆分)
    // 复数s兜底：剥掉s/es后剩余部分能完整拆解才放行(acquaintances→quaint+ance+s)。防误伤三门槛：
    // ① es形变须符合复数形态(s/z/x/ch/sh/o结尾)  ② 拆解无基本词、词根合计≥3字符  ③ 拆解不再含e/s/es弱后缀
    if (suf === 'e' && !rootOf(rest, depth)) continue;
    // -et 小称后缀只接"真词根"、不接基本词（防 wallet→wall+et、rocket→rock+et、bucket→buck+et 假拆）
    if (suf === 'et') {
      const rr = rootOf(rest, depth);
      if (!rr || rr.isBase) continue;
    }
    if ((suf === 's' || suf === 'es') && !rootOf(rest, depth)) {
      if (suf === 'es' && !/[szx]$/.test(rest) && !/(ch|sh|o)$/.test(rest)) continue;
      const sr = decompose(rest, depth + 1);
      if (!sr || sr.roots.some(r => r.isBase) || sr.roots.reduce((n, r) => n + r.m.length, 0) < 3 || sr.suffixes.some(x => x.m === 'e' || x.m === 's' || x.m === 'es')) continue;
    }
    const sub = decompose(rest, depth + 1);
    if (!sub) continue;
    const rootLen = sub.roots.reduce((n, r) => n + (r.isBase ? 0 : r.m.length), 0);
    candidates.push({
      prefix: sub.prefix,
      roots: sub.roots,
      suffixes: (sub.suffixes || []).concat([{ m: suf, meaning: sufM }]),
      score: rootLen * 2 + (sub.prefix ? sub.prefix.m.length * 0.2 : 0) - (sub.roots.length + sub.suffixes.length) * 14 + (sub.suffixes.length + 1) * 9 - (sub.roots.some(r => r.flex) ? 6 : 0)
    });
  }

  // 3. 复合词：整段拆成 2~3 个词根（可夹连接元音）
  for (const g of splitRoots(w, depth)) {
    const rootLen = g.roots.reduce((n, r) => n + (r.isBase ? 0 : r.m.length), 0);
    candidates.push({
      prefix: null, roots: g.roots, suffixes: [],
      // 含基本词或变形还原词根的复合候选额外罚分，避免压过"真前缀+真词根"(如 complete 不拆成 come+plete)
      score: rootLen * 2 - (g.roots.length - 1) * 14 - (g.roots.some(r => r.isBase) ? 6 : 0)
    });
  }

  /* 误拆防线：strophe 系列词（希腊语 strephein 转）内部含 troph/trop，
     以及个别 trop 撞车词，禁止用 troph/trop 词根，避免 as-troph-ile、
     re-trop+tell+ar 这类错误拆法（dystrophy 含 stroph 但确需 dys+troph+y，故按词拦截） */
  if (TROP_STROPHE_BLOCK.has(w)) {
    candidates = candidates.filter(c => !(c.roots || []).some(r => r.m === 'troph' || r.m === 'trop'));
  }

  if (candidates.length === 0) return null;

  // 去重：同一(前缀, 词根组) 保留后缀最少者；再取最高分
  const best = new Map();
  for (const c of candidates) {
    const key = (c.prefix ? c.prefix.m : '') + '|' + c.roots.map(r => r.m).join('+');
    const prev = best.get(key);
    if (!prev || c.suffixes.length < prev.suffixes.length ||
        (c.suffixes.length === prev.suffixes.length && c.score > prev.score)) {
      best.set(key, c);
    }
  }
  return [...best.values()].sort((a, b) => b.score - a.score)[0];
}

/* 把一段字母拆成 2~3 个已知词根（支持复合词和连接元音） */
function splitRoots(seg, depth) {
  const res = [];
  if (!seg || seg.length < 2) return res;
  for (let i = 2; i < seg.length - 2; i++) {
    const a = rootOf(seg.slice(0, i), depth), b = rootOf(seg.slice(i), depth);
    if (a && b) res.push({ roots: [a, b] });
  }
  for (let i = 2; i < seg.length - 4; i++) {
    for (let k = i + 1; k < seg.length - 2; k++) {
      const a = rootOf(seg.slice(0, i), depth), b = rootOf(seg.slice(i, k), depth), c = rootOf(seg.slice(k), depth);
      if (a && b && c) res.push({ roots: [a, b, c] });
      if (a && c && /^[ioae]$/.test(seg.slice(i, k)) && !PREFIXES[seg.slice(0, k)]) res.push({ roots: [a, c] });
    }
  }
  return res;
}

/* 部分拆解兜底：完全拆不开时，优先展示"整词开头的真词根 + 未识别"
   （如 architecture → arch + ??itecture、democracy → dem + ??ocracy），
   其次才是"多字母前缀 + 未识别"（如 automato → auto- + mato）。
   避免误把真词根的开头当 ad/de 变体前缀(如 ar-、de-)。放在 analyze 层而不是 decompose 里，
   避免部分结果被父层递归拼进正常拆解（如 unhappy+ness 不被 un + 未识别 顶掉）。 */
function partialDecompose(w) {
  // 1. 词根前缀：整词以某真词根开头，剩余部分够长
  let bestRoot = null, bestRlen = 0;
  for (const rk of Object.keys(ROOTS)) {
    if (rk.length < 2 || rk.length <= bestRlen) continue;
    if (!w.startsWith(rk)) continue;
    const rest = w.slice(rk.length);
    if (rest.length < 2) continue;
    bestRoot = { m: rk, meaning: ROOTS[rk][0], cognates: ROOTS[rk][1] || [] };
    bestRlen = rk.length;
  }
  if (bestRoot) {
    return { prefix: null, roots: [bestRoot], suffixes: [], unknown: w.slice(bestRlen) };
  }
  // 2. 前缀兜底
  let bestPre = null, bestLen = 0;
  for (const [pre, preM] of LISTS.prefixes) {
    if (pre.length < 2 || pre.length <= bestLen) continue;
    if (!w.startsWith(pre)) continue;
    // 同 decompose：整词以该前缀的 blocked 基本词开头时跳过（isolate 非 iso- 前缀）
    let blocked = false;
    for (const bw of BASE_PREFIXES[pre] || []) {
      if (w.startsWith(bw)) { blocked = true; break; }
    }
    if (blocked) continue;
    const rest = w.slice(pre.length);
    if (rest.length < 2) continue;
    bestPre = { m: pre, meaning: preM };
    bestLen = pre.length;
  }
  if (bestPre) return { prefix: bestPre, roots: [], suffixes: [], unknown: w.slice(bestPre.m.length) };

  // 3. 后缀兜底：整词以已知后缀结尾、剩余部分拆不开时展示「??词干 + 后缀」
  //    （vehemently → ??vehement + ly）。防误伤三条防线：
  //    ① 整词本身是基本词/词根则跳过（family 不是 famil+ly）
  //    ② 排除弱后缀 es（同 decompose，防 mosses→moss+es）
  //    ③ 词干至少 4 个字符（only 不拆成 on+ly、silly 不拆成 sil+ly）
  if (rootOf(w, 0)) return null;
  let bestSuf = null, bestSlen = 0;
  for (const [suf, sufM] of LISTS.suffixes) {
    if (suf.length < 2 || suf === 'es' || suf.length <= bestSlen) continue;
    if (!w.endsWith(suf)) continue;
    const rest = w.slice(0, w.length - suf.length);
    if (rest.length < 4) continue;
    // -et 同 decompose：词干是基本词则跳过（wallet 不显示 ??wall+-et）
    if (suf === 'et' && rootOf(rest, 0) && rootOf(rest, 0).isBase) continue;
    bestSuf = { m: suf, meaning: sufM };
    bestSlen = suf.length;
  }
  if (!bestSuf) return null;
  return { prefix: null, roots: [], suffixes: [bestSuf], unknown: w.slice(0, w.length - bestSuf.m.length) };
}

/* 编辑距离（Damerau-Levenshtein）：相邻字母换位算一次编辑，
   能识别常见拼错（recieve→receive 的 ei/ie、binery→binary 的 er/re）。 */
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev2 = null, prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] && prev2) {
        cur[j] = Math.min(cur[j], prev2[j - 2] + 1);   // 相邻换位
      }
    }
    prev2 = prev;
    prev = cur;
  }
  return prev[n];
}

/* 词不存在时，在考试词库里找拼写相近的词作为建议。
   阈值：短词(≤5字母)距离 ≤1，长词 ≤2；
   首字母不同重罚（避免 finery 顶替 binery→binary）；
   距离 2 的长词若末尾不同再半罚（排除 meaningless 类）。 */
function suggestWord(w) {
  if (!ENHANCED || w.length < 3) return null;
  const MAX_DIST = w.length <= 5 ? 1 : 2;
  let best = null, bestDist = 99;
  for (const cand of Object.keys(ENHANCED)) {
    if (Math.abs(cand.length - w.length) > 2) continue;
    let d = editDistance(w, cand);
    if (w[0] !== cand[0]) d += 2;                       // 首字母不同 → 重罚
    else if (d === 2 && w.length > 5 && w[w.length - 1] !== cand[cand.length - 1]) d += 0.5;
    if (d < bestDist) { bestDist = d; best = cand; }
  }
  if (best && bestDist <= MAX_DIST) return best;
  return null;
}

function analyze(raw) {
  const w = raw.toLowerCase().replace(/[^a-z]/g, '');
  if (w.length < 2) return { found: false, reason: '请输入至少两个字母的单词' };
  if (ENHANCED && ENHANCED[w]) {
    return { found: true, word: w, source: 'enhanced', enhanced: ENHANCED[w], breakdown: null };
  }
  // 二级查词：全量词典兜底
  if (ECDICT && ECDICT[w]) {
    return { found: true, word: w, source: 'ecdict', ecdict: ECDICT[w], breakdown: null };
  }
  const bd = decompose(w, 0);
  if (bd) {
    return {
      found: true, word: w, source: 'builtin',
      breakdown: { ...bd, cognates: (bd.roots[0] && bd.roots[0].cognates) || [] },
      suggestion: suggestWord(w)
    };
  }
  const partial = partialDecompose(w);
  if (partial) {
    return { found: true, word: w, source: 'builtin', breakdown: { ...partial, cognates: [] }, suggestion: suggestWord(w) };
  }
  return { found: false, reason: '未发现明显的词根词缀结构', word: w, suggestion: suggestWord(w) };
}

/* 构成逻辑：把各部分含义拼成一句话 */
function compose(b) {
  const parts = [];
  if (b.prefix) parts.push(prefMeaning(b.prefix, b.roots[0] && b.roots[0].m));
  if (b.roots) b.roots.forEach(r => parts.push(r.meaning));
  if (b.suffixes) b.suffixes.forEach(s => parts.push(s.meaning));
  if (b.unknown) parts.push('未识别部分「' + b.unknown + '」');
  return parts.join(' + ').split(';').join(' 或 ');
}

/* 把一次拆解结果渲染成「词根词缀分解 + 词源演变链」HTML。
   ecdict 词与 enhanced 空 breakdown 兜底共用。bd 为 null 返回空串。 */
function morphBlockHTML(w, bd) {
  if (!bd) return '';
  let h = '';
  const chunks = [];
  if (bd.prefix) chunks.push({ label: '前缀', m: bd.prefix.m + '-', mtext: prefMeaning(bd.prefix, bd.roots[0] && bd.roots[0].m) });
  bd.roots.forEach(rr => chunks.push({ label: '词根', m: rr.m, mtext: rr.meaning }));
  if (bd.suffixes) bd.suffixes.forEach(s => chunks.push({ label: '后缀', m: '-' + s.m, mtext: s.meaning }));
  if (bd.unknown) chunks.push({ label: '未识别', m: bd.unknown, mtext: '词源待考' });
  if (chunks.length) {
    h += `<div class="meaning"><div class="label">词根词缀分解</div><div class="breakdown">`;
    chunks.forEach((c, i) => {
      if (i > 0) h += `<span class="plus">+</span>`;
      h += `<span class="morph"><b>${c.m}</b><span class="m">${c.label}<br>${c.mtext}</span></span>`;
    });
    h += `</div></div>`;
  }
  const chainParts = [];
  const allMorphs = []
    .concat(bd.prefix ? [{ m: bd.prefix.m.replace(/-.*$/, ''), isPre: true }] : [])
    .concat(bd.roots.map(rr => ({ m: rr.m, meaning: rr.meaning || '' })))
    .concat(bd.suffixes.map(ss => ({ m: ss.m, meaning: ss.meaning || '' })));
  for (const mp of allMorphs) {
    let src = MORPH_SRC[mp.m];
    if (!src && ROOTS[mp.m] && ROOTS[mp.m][2]) src = ROOTS[mp.m][2];   // 词根表显式来源（blank→古法语 blanc）
    if (!src && mp.m.length >= 3) {
      // 变体映射：aut→auto, motor→motor, net→net
      for (const cand of [mp.m + 'o', mp.m + 'e', mp.m.slice(0, -1), mp.m.slice(0, -1) + 'o']) {
        if (MORPH_SRC[cand]) { src = MORPH_SRC[cand]; break; }
      }
    }
    chainParts.push({ m: mp.m, meaning: mp.meaning || (src && src.meaning) || (mp.isPre ? (mp.m + '-') : ''), src: src });
  }
  const hasChainSrc = chainParts.some(cp => cp.src);
  if (hasChainSrc) {
    h += `<div class="meaning"><div class="label">词源演变链</div><div class="chain">`;
    chainParts.forEach((cp, idx) => {
      if (cp.src) {
        const note = cp.src.note ? `<span class="note">（${cp.src.note}）</span>` : '';
        h += `<div class="chain-item" style="--i:${idx}"><span class="chain-morph">${cp.m}</span>` +
          `<span class="chain-arrow">←</span>` +
          `<span class="chain-src"><span class="lang">${cp.src.lang}</span><span class="w">${cp.src.word}</span>${note}</span>` +
          `<span class="chain-meaning">${cp.meaning ? '（' + cp.meaning + '）' : ''}</span></div>`;
      } else {
        h += `<div class="chain-item" style="--i:${idx}"><span class="chain-morph">${cp.m}</span>` +
          `<span class="chain-nosrc">${cp.meaning || ''}</span></div>`;
      }
    });
    h += `</div></div>`;
  }
  return h;
}

/* enhanced 词自带 breakdown 为空的兜底（theocracy 等）：跑引擎拆解，质量达标才渲染。
   门槛从严，只放可靠拆解，避免把基本词（air/bread）或错拆（beautify→be+aut+ify、
   rescission→re+sci+s+sion）显示出来。不达标返回空串，保持原样。 */
function enhancedMorphFallback(w) {
  const bd = decompose(w, 0) || partialDecompose(w);
  if (!bd || !(bd.roots || []).length) return '';
  if (bd.unknown) return '';                                     // 1. 必须全识别
  if (bd.roots.some(r => r.isBase)) return '';                   // 2. 词根不能是基本词
  if (bd.roots.some(r => r.m.length < 3)) return '';             // 3. 词根至少3字符
  if (w.length < 6) return '';                                   // 4. 短词不自动拆
  if (bd.prefix && bd.prefix.m.includes('-')) return '';         // 5. 前缀含连字符=叠前缀（un-a-ware-s 错拆）
  const nPre = bd.prefix ? 1 : 0;
  const chunks = nPre + (bd.roots || []).length + (bd.suffixes || []).length;
  if (chunks < 2) return '';                                     // 6. 至少2个词素
  const tot = (nPre ? bd.prefix.m.length : 0) + (bd.roots || []).reduce((n, x) => n + x.m.length, 0)
    + (bd.suffixes || []).reduce((n, x) => n + x.m.length, 0);
  const rootsum = (bd.roots || []).reduce((n, x) => n + x.m.length, 0);
  if (tot / w.length < 0.6) return '';                           // 7. 全识别覆盖≥60%
  if (rootsum / w.length < 0.5) return '';                       // 8. 词根占比≥50%（防前后缀撑腰）
  return morphBlockHTML(w, bd);
}
</script>

<script>
/* ============================================================
   UI 逻辑

    await new Promise(r => setTimeout(r, 30));

    Object.assign(ENHANCED, enh);
    if (tip) tip.textContent = '考试词库加载完成（' + Object.keys(ENHANCED).length + ' 词），正在加载全量词典…';
    await new Promise(r => setTimeout(r, 30));

    const dictRes = await fetch('ecdict.json');
    const dictText = await dictRes.text();
    await new Promise(r => setTimeout(r, 30));
    const dict = JSON.parse(dictText);
    // ecdict 数据源的 \n 是字面反斜杠+n，归一化为真实换行，界面渲染才正常
    for (const k in dict) { const e = dict[k]; if (e.t) e.t = e.t.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n'); if (e.d) e.d = e.d.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n'); }
    Object.assign(ECDICT, dict);
    buildIndex();
    DATA_READY = true;
    if (tip) tip.textContent = '已加载 ' + Object.keys(ENHANCED).length + ' 考试词 + ' + Object.keys(ECDICT).length + ' 全量词';
    setTimeout(() => { if (tip) tip.textContent = ''; }, 4000);
  } catch (e) {
    console.error('数据加载失败', e);
    if (tip) tip.textContent = '数据加载失败，请确认已用 start.bat 启动（不能用旧 wordroot.html）';
  }
}
loadData();

const input = document.getElementById('input');
const btn = document.getElementById('btn');
const result = document.getElementById('result');

/* 数据措辞白话化：数据自带的"小后缀/指小后缀"用户看不懂，翻译成大白话 */
function dp(s) {
  return (s || '').replace(/指?小后缀/g, '小后缀：小的…（像中文的儿字）');
}

/* 生成完整卡片 HTML（单查词 render 与右侧面板共用） */
function cardHTML(r) {
  let html = '';

  if (r.found && r.source === 'enhanced') {
    const e = r.enhanced;
    html += `<div class="card">
      <div class="word-line">
        <span class="word">${r.word}</span>
        <span class="badge enhanced">增强词表</span>
        <button class="tts-btn" data-w="${r.word}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">☆ 收藏</button>
      </div>`;
    if (e.pron) html += `<div class="meaning"><div class="label">音标</div>${e.pron}</div>`;
    if (e.meaning) html += `<div class="meaning"><div class="label">释义</div>${e.meaning}</div>`;
    if (e.breakdown) {
      html += `<div class="meaning"><div class="label">词根词缀分解</div>${dp(e.breakdown)}</div>`;
    } else {
      // 数据缺 breakdown（theocracy 等）：跑引擎兜底，质量达标才显示，否则保持空白
      html += enhancedMorphFallback(r.word);
    }
    if (e.chain && e.chain.length) {
      html += `<div class="meaning"><div class="label">词源演变链</div><div class="chain">`;
      e.chain.forEach((m, idx) => {
        const mm = dp(m.meaning);
        if (m.source && m.source.lang) {
          const note = m.source.note ? `<span class="note">（${m.source.note}）</span>` : '';
          html += `<div class="chain-item" style="--i:${idx}"><span class="chain-morph">${m.m}</span>` +
            `<span class="chain-arrow">←</span>` +
            `<span class="chain-src"><span class="lang">${m.source.lang}</span><span class="w">${m.source.word}</span>${note}</span>` +
            `<span class="chain-meaning">${mm ? '（' + mm + '）' : ''}</span></div>`;
        } else {
          html += `<div class="chain-item" style="--i:${idx}"><span class="chain-morph">${m.m}</span>` +
            `<span class="chain-nosrc">${mm || ''}</span></div>`;
        }
      });
      html += `</div></div>`;
    }
    if (e.etymology) html += `<div class="meaning"><div class="label">词源</div>${e.etymology}</div>`;
    if (e.examples && e.examples.length) {
      html += `<div class="meaning"><div class="label">例句</div>`;
      e.examples.slice(0, 3).forEach(ex => {
        const sep = ex.indexOf(' / ');
        if (sep > -1) {
          const enTxt = ex.slice(0, sep);
          html += `<div class="ex"><div class="ex-en"><span class="ex-en-txt">${enTxt}</span>` +
            `<button class="tts-btn ex-tts" data-text="${escapeHtml(enTxt).replace(/"/g, '&quot;')}" title="朗读英文例句">🔊</button></div>` +
            `<div class="ex-zh">${ex.slice(sep + 3)}</div></div>`;
        } else {
          html += `<div class="ex"><div class="ex-zh">${ex}</div></div>`;
        }
      });
      html += `</div>`;
    }
    const cog = findCognates(r.word);
    if (cog.srcs.length || cog.morphs.length) {
      html += `<div class="cognates"><div class="label">同源词 / 同根词</div>`;
      cog.srcs.forEach(s => {
        const tags = s.words.slice(0, 15).map(w => `<span class="cog" data-w="${w}">${w}</span>`).join('');
        html += `<div class="cog-row"><span class="cog-lbl">${s.lang} ${s.word}</span>：${tags}</div>`;
      });
      cog.morphs.forEach(s => {
        const tags = s.words.slice(0, 15).map(w => `<span class="cog" data-w="${w}">${w}</span>`).join('');
        html += `<div class="cog-row"><span class="cog-lbl">同根 ${s.m}</span>：${tags}</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  } else if (r.source === 'ecdict') {
    const d = r.ecdict;
    html += `<div class="card">
      <div class="word-line">
        <span class="word">${r.word}</span>
        <span class="badge">全量词典</span>
        <button class="tts-btn" data-w="${r.word}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">☆ 收藏</button>
      </div>`;
    if (d.p) html += `<div class="meaning"><div class="label">音标</div>${d.p}</div>`;
    if (d.g) html += `<div class="meaning"><div class="label">词性</div>${d.g}</div>`;
    if (d.t) html += `<div class="meaning"><div class="label">释义</div>${d.t.replace(/\n/g, '<br>')}</div>`;
    if (d.d) {
      html += `<div class="meaning"><div class="label">英文释义</div>`;
      d.d.split('\n').map(s => s.trim()).filter(Boolean).forEach(ln => {
        html += `<div class="ex-en def-line"><span class="ex-en-txt">${ln}</span>` +
          `<button class="tts-btn ex-tts" data-text="${escapeHtml(ln).replace(/"/g, '&quot;')}" title="朗读这条释义">🔊</button></div>`;
      });
      html += `</div>`;
    }
    // 全量词：先拆解（完整优先，失败退回部分拆解，如 binary→bi-+??nary），
    // 再据此生成分解区块与词源演变链（渲染逻辑与 enhanced 兜底共用 morphBlockHTML）
    html += morphBlockHTML(r.word, decompose(r.word, 0) || partialDecompose(r.word));
    const cog2 = findCognates(r.word);
    if (cog2.morphs.length) {
      html += `<div class="cognates"><div class="label">同根词</div>`;
      cog2.morphs.forEach(s => {
        const tags = s.words.slice(0, 15).map(w => `<span class="cog" data-w="${w}">${w}</span>`).join('');
        html += `<div class="cog-row"><span class="cog-lbl">同根 ${s.m}</span>：${tags}</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  } else if (r.found) {
    const b = r.breakdown;
    const chunks = [];
    if (b.prefix) chunks.push({ label: '前缀', m: b.prefix.m + '-', mtext: prefMeaning(b.prefix, b.roots[0] && b.roots[0].m) });
    b.roots.forEach(r => chunks.push({ label: '词根', m: r.m, mtext: r.meaning }));
    if (b.suffixes) b.suffixes.forEach(s => chunks.push({ label: '后缀', m: '-' + s.m, mtext: s.meaning }));
    if (b.unknown) chunks.push({ label: '未识别', m: b.unknown, mtext: '词源待考' });

    html += `<div class="card">
      <div class="word-line">
        <span class="word">${r.word}</span>
        <span class="badge">词根拆解</span>
        <button class="tts-btn" data-w="${r.word}" title="发音">🔊</button>
        <button class="fav-btn${isFav(r.word) ? ' on' : ''}" data-fav="${r.word}">☆ 收藏</button>
      </div>`;
    if (r.suggestion && r.suggestion !== r.word) {
      html += `<div class="spell-suggest">疑似拼写错误？你想查的是 <span class="cog" data-w="${r.suggestion}">${r.suggestion}</span> 吗？（点击跳转）</div>`;
    }
    html += `<div class="breakdown">`;
    chunks.forEach((c, i) => {
      if (i > 0) html += `<span class="plus">+</span>`;
      html += `<span class="morph"><b>${c.m}</b><span class="m">${c.label}<br>${c.mtext}</span></span>`;
    });
    html += `</div>`;

    // 构成逻辑
    const eq = [];
    if (b.prefix) eq.push(b.prefix.m + '(' + prefMeaning(b.prefix, b.roots[0] && b.roots[0].m).split(';').join('/') + ')');
    b.roots.forEach(r => eq.push(r.m + '(' + r.meaning + ')'));
    if (b.suffixes) b.suffixes.forEach(s => eq.push(s.m + '(' + s.meaning + ')'));
    if (b.unknown) eq.push(b.unknown + '(未识别)');
    if (eq.length > 1) {
      html += `<div class="meaning"><div class="label">构成逻辑</div>
        <span class="eq">${eq.join(' + ')}</span>
        <br>合起来大致是「${compose(b)}」——结合此含义理解单词的完整词义。</div>`;
    }

    // 同根词：查 MORPH_INDEX（可点击跳转），无结果时回退词根表例词
    const cog2 = findCognates(r.word);
    let cogMorphs = cog2.morphs || [];
    if (!cogMorphs.length && b.cognates && b.cognates.length) {
      cogMorphs = [{ m: b.roots[0] && b.roots[0].m, words: b.cognates }];
    }
    if (cogMorphs.length) {
      html += `<div class="cognates"><div class="label">同根词</div>`;
      cogMorphs.forEach(s => {
        const tags = s.words.slice(0, 15).map(w => `<span class="cog" data-w="${w}">${w}</span>`).join('');
        html += `<div class="cog-row"><span class="cog-lbl">同根 ${s.m}</span>：${tags}</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="card"><div class="miss">
      ${r.reason}<br>`;
    if (r.suggestion && r.suggestion !== r.word) {
      html += `你是不是想查 <span class="cog" data-w="${r.suggestion}">${r.suggestion}</span>？（点击跳转）<br>`;
    }
    html += `这个词很可能是自由词素（基本词）或词源特殊。试试其他单词，或运行"下载增强词表"扩大覆盖。
    </div></div>`;
  }

  return html;
}

function render(r) {
  result.innerHTML = cardHTML(r);
  result.classList.add('show');
  if (r.found) saveHistory(r);
}

function search() {
  const v = input.value.trim();
  if (!v) return;
  if (!DATA_READY) {
    const tip = document.getElementById('load-tip');
    result.innerHTML = '<div class="card"><div class="miss">词库仍在加载，请稍候片刻再试…</div></div>';
    result.classList.add('show');
    return;
  }
  // 含空格即视为一段话 → 段落阅读模式；单个词走原查词
  if (/\s/.test(v)) { renderParagraph(v); return; }
  render(analyze(v));
}

/* ============================================================
   段落阅读模式：贴一段话进来，点词内联展开拆解
   ============================================================ */
// 高频功能词：段落里跳过，不作为可点词
const FUNC_WORDS = new Set(['the','a','an','to','of','in','on','at','for','with','by','and','or','but','so','as','from','into','onto','this','that','these','those','there','it','its','is','are','was','were','be','been','am','has','have','had','do','does','did','will','would','can','could','shall','should','may','might','not','no','yes','i','me','my','we','us','our','you','your','he','him','his','she','her','they','them','their']);

// 判断一个词在段落里是否值得展开：功能词跳过；builtin 拆解需"已识别覆盖>=60%且含词根"；
// 词典词（enhanced/ecdict）是真词，显示释义。
function noteHasValue(r, w) {
  if (FUNC_WORDS.has(w)) return false;
  if (!r || !r.found) return false;
  if (r.source === 'builtin' && r.breakdown) {
    const b = r.breakdown;
    const ident = (b.prefix ? b.prefix.m.length : 0)
      + (b.roots || []).reduce((n, x) => n + (x.isBase ? 0 : x.m.length), 0)
      + (b.suffixes || []).reduce((n, x) => n + x.m.length, 0);
    return (b.roots || []).length > 0 && ident / w.length >= 0.6;
  }
  return true;  // enhanced/ecdict
}

function renderParagraph(text) {
  // 按单词切分，保留标点空格。词: [A-Za-z']+，其余原样。
  const tokens = text.split(/([A-Za-z']+)/);
  const analyzed = new Map();  // word -> {r, note} 缓存，避免重复拆解
  let html = '<div class="para-head"><button class="tts-btn" data-text="' +
    escapeHtml(text).replace(/"/g, '&quot;') + '" title="朗读整段">🔊 朗读整段</button></div>';
  html += '<div class="para">';
  for (const tok of tokens) {
    if (!tok) continue;
    if (/^[A-Za-z']+$/.test(tok)) {
      const key = tok.toLowerCase().replace(/[^a-z]/g, '');
      let entry = analyzed.get(key);
      if (!entry) {
        const r = analyze(key);
        analyzed.set(key, entry = { r });
      }
      if (noteHasValue(entry.r, key)) {
        // 有拆解/释义的词 → 可点击 token，点击切右侧面板
        html += `<span class="ptok" data-w="${tok}">${tok}</span> `;
      } else {
        html += `<span>${tok}</span> `;
      }
    } else {
      html += escapeHtml(tok);
    }
  }
  html += '</div>';
  result.innerHTML = html;
  result.classList.add('show');
}

/* 右侧滑出面板：段落深读用，复用 cardHTML 渲染完整卡片 */

const HIST_KEY = 'wr_history';
/* ---------- 收藏 ---------- */

function saveFavs(f) { try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }

function toggleFav(w) {

  if (f.includes(w)) f = f.filter(x => x !== w);
  else f.unshift(w);

}
function renderFavs() {

// 从分析结果里抽出一行摘要，方便扫一眼复习
function historySummary(r) {
  if (r.source === 'enhanced' && r.enhanced) {
    const e = r.enhanced;
    let s = (e.meaning || '').split('\n')[0].trim() || '';
    if (e.breakdown) s = (e.breakdown.split('\n')[0].trim() + ' · ' + s).replace(/^· /, '');
    return s;
  }
  const b = r.breakdown;
  if (b) {
    const parts = [];
    if (b.prefix) parts.push(b.prefix.m + '(' + b.prefix.meaning + ')');
    (b.roots || []).forEach(r0 => parts.push(r0.m + '(' + r0.meaning + ')'));
    (b.suffixes || []).forEach(s0 => parts.push('-' + s0.m + '(' + s0.meaning + ')'));
    if (r.source === 'builtin') return '词根 · ' + b.roots[0].meaning;
    return parts.join(' + ');
  }
  return '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 解码 HTML 实体：数据里存的是 &amp;#x27; 这类，显示靠浏览器自动解码，
// 但朗读时传给 TTS 的是原始串，必须还原成真实字符（如 ' 和 "）。
function decodeEntities(s) {
  return String(s)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&#x27;/g, "'").replace(/&#39;/g, "'").replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}

let fsHandle = null;   // 已连接的本地记录文件句柄

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; }
}

function saveHistory(r) {
  let h = loadHistory();
  h = h.filter(x => x.w !== r.word);          // 同词去重，移到最前
  h.unshift({ w: r.word, s: historySummary(r), t: Date.now() });
  if (h.length > 60) h = h.slice(0, 60);      // 只留最近 60 条，防止膨胀
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch (e) {}
  if (fsHandle) writeToFile(h);               // 已连本地文件则同步写盘
  renderHistory();
}

// 把记录写入连接的本地文件（JSON，可读可改）
async function writeToFile(h) {
  if (!fsHandle) return;
  try {
    const w = await fsHandle.createWritable();
    await w.write(JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), items: h }, null, 2));
    await w.close();
  } catch (e) { /* 写盘失败时数据仍在 localStorage，静默即可 */ }
}

// 选择本地记录文件，建立自动同步
async function connectLocalFile() {
  if (!window.showSaveFilePicker) {
    alert('当前浏览器不支持自动写入本地文件。\n请改用 Edge 或 Chrome 打开本页，或用"导出"按钮手动备份。');
    return;
  }
  try {
    fsHandle = await window.showSaveFilePicker({
      suggestedName: '查词记录.json',
      types: [{ description: '查词记录 (JSON)', accept: { 'application/json': ['.json'] } }],
    });
    await mergeFromFile();       // 若该文件已有旧记录，先合并进来
    await writeToFile(loadHistory());
    updateLocalBtn();
    renderHistory();
  } catch (e) { /* 用户中途取消选择 */ }
}

// 读取已连接文件里的旧记录并合并——就算浏览器数据被清，重新连一次文件记录就回来了
async function mergeFromFile() {
  try {
    const f = await fsHandle.getFile();
    const data = JSON.parse(await f.text());
    const items = data && Array.isArray(data.items) ? data.items : [];
    if (!items.length) return;
    const merged = loadHistory().concat(items).sort((a, b) => (b.t || 0) - (a.t || 0));
    const map = new Map();               // 同一单词只保留时间最新的一条
    merged.forEach(x => { if (x && x.w && (!map.has(x.w) || (map.get(x.w).t || 0) < (x.t || 0))) map.set(x.w, x); });
    const h = [...map.values()].slice(0, 60);
    try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch (e) {}
  } catch (e) { /* 文件为空或格式不合法则忽略 */ }
}

// 一键导出当前记录（另存一份，用于备份或换电脑迁移）
async function exportHistory() {
  const h = loadHistory();
  if (!h.length) { alert('暂无记录可导出'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), items: h }, null, 2)],
    { type: 'application/json' });
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: '查词记录-' + stamp + '.json',
        types: [{ description: '查词记录 (JSON)', accept: { 'application/json': ['.json'] } }],
      });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return;
    } catch (e) { /* 用户取消则走下方降级下载 */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '查词记录-' + stamp + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function updateLocalBtn() {
  const b = document.getElementById('h-local');
  if (!b) return;
  if (fsHandle) { b.textContent = '已存本地 ✓'; b.disabled = true; }
  else { b.textContent = '存到本地'; b.disabled = false; }
}

function renderHistory() {
  const el = document.getElementById('history');
  let h = [];
  try { h = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { h = []; }
  if (!h.length) { el.classList.remove('show'); el.innerHTML = ''; return; }

  const items = h.map(x => {
    const d = new Date(x.t);
    const ts = (d.getMonth() + 1) + '-' + d.getDate() + ' ' +
      (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
      (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    return '<div class="h-item" data-word="' + escapeHtml(x.w) + '">' +
      '<span class="h-w">' + escapeHtml(x.w) + '</span>' +
      '<span class="h-s">' + escapeHtml(x.s) + '</span>' +
      '<span class="h-t">' + ts + '</span></div>';
  }).join('');

  el.innerHTML = '<div class="h-head">查词记录' +
    '<span class="h-n">' + h.length + '</span>' +
    '<button class="h-btn" id="h-export">导出</button>' +
    '<button class="h-btn" id="h-local">' + (fsHandle ? '已存本地 ✓' : '存到本地') + '</button>' +
    '<button class="h-btn" id="h-clear">清空</button></div>' + items;
  el.classList.add('show');
}

// 历史列表交互：点条目重新查这个词；点导出备份；点存到本地连文件；点清空删除全部
document.getElementById('history').addEventListener('click', (e) => {
  const item = e.target.closest('.h-item');
  if (item) {
    input.value = item.dataset.word;
    search();
    return;
  }
  if (e.target.id === 'h-export') { exportHistory(); return; }
  if (e.target.id === 'h-local') { connectLocalFile(); return; }
  if (e.target.id === 'h-clear' && confirm('确定清空全部查词记录吗？')) {
    localStorage.removeItem(HIST_KEY);
    if (fsHandle) writeToFile([]);   // 清空时同步清掉本地文件内容
    renderHistory();
  }
});

/* ============================================================
   发音功能：内置浏览器语音（即点即播）+ Kokoro 高音质（本地服务）
   ============================================================ */
const KOKORO_URL = 'http://127.0.0.1:8757';
const KOKORO_VOICES = [
  ['af_heart', '美音·女·Heart'], ['af_bella', '美音·女·Bella'], ['af_nicole', '美音·女·Nicole'],
  ['af_aoede', '美音·女·Aoede'], ['af_kore', '美音·女·Kore'],
  ['am_adam', '美音·男·Adam'], ['am_michael', '美音·男·Michael'],
  ['bf_emma', '英音·女·Emma'], ['bf_isabella', '英音·女·Isabella'], ['bm_george', '英音·男·George']
];

let ttsEngine = localStorage.getItem('wr_tts_eng') || 'builtin';
let ttsKokoroVoice = localStorage.getItem('wr_tts_voice') || 'af_heart';
let ttsBuiltinLang = localStorage.getItem('wr_tts_lang') || 'en-US';
let ttsSpeed = parseFloat(localStorage.getItem('wr_tts_speed')) || 1;
let kokoroOk = false;   // TTS 服务是否可用，启动时探测

const ttsVoiceSel = document.getElementById('tts-voice');
const ttsSpeedSel = document.getElementById('tts-speed');
const ttsHint = document.getElementById('tts-hint');

// 内置浏览器语音
function speakBuiltin(text, rate) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ttsBuiltinLang;
  u.rate = rate;
  speechSynthesis.speak(u);
}

// Kokoro 高音质：请求本地 TTS 服务合成并播放
async function speakKokoro(text) {
  const r = await fetch(KOKORO_URL + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, voice: ttsKokoroVoice, speed: ttsSpeed })
  });
  if (!r.ok) throw new Error('TTS ' + r.status);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = new Audio(url);
  a.onended = () => URL.revokeObjectURL(url);
  await a.play();
}

// 统一入口：按当前引擎播放，Kokoro 失败时静默回退内置语音
function speakText(text) {
  text = decodeEntities(text);   // 还原 &#x27;/&quot; 等实体，朗读才跟原文一致
  if (ttsEngine === 'kokoro' && kokoroOk) {
    speakKokoro(text).catch(() => speakBuiltin(text, ttsSpeed));
  } else {
    speakBuiltin(text, ttsSpeed);
  }
}

function fillVoiceOptions() {
  ttsVoiceSel.innerHTML = '';
  if (ttsEngine === 'kokoro') {
    KOKORO_VOICES.forEach(([v, label]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      if (v === ttsKokoroVoice) o.selected = true;
      ttsVoiceSel.appendChild(o);
    });
  } else {
    [['en-US', '美音'], ['en-GB', '英音']].forEach(([v, label]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      if (v === ttsBuiltinLang) o.selected = true;
      ttsVoiceSel.appendChild(o);
    });
  }
}

function updateTtsHint() {
  ttsHint.textContent = (ttsEngine === 'kokoro' && !kokoroOk)
    ? 'Kokoro 服务未启动，已回退内置语音' : '';
}

// 工具条交互
document.querySelectorAll('.tts-eng').forEach(b => {
  b.classList.toggle('active', b.dataset.eng === ttsEngine);
  b.addEventListener('click', () => {
    ttsEngine = b.dataset.eng;
    localStorage.setItem('wr_tts_eng', ttsEngine);
    document.querySelectorAll('.tts-eng').forEach(x => x.classList.toggle('active', x === b));
    fillVoiceOptions();
    updateTtsHint();
  });
});
ttsVoiceSel.addEventListener('change', () => {
  if (ttsEngine === 'kokoro') {
    ttsKokoroVoice = ttsVoiceSel.value;
    localStorage.setItem('wr_tts_voice', ttsKokoroVoice);
  } else {
    ttsBuiltinLang = ttsVoiceSel.value;
    localStorage.setItem('wr_tts_lang', ttsBuiltinLang);
  }
});
ttsSpeedSel.addEventListener('change', () => {
  ttsSpeed = parseFloat(ttsSpeedSel.value) || 1;
  localStorage.setItem('wr_tts_speed', String(ttsSpeed));
});
fillVoiceOptions();

// 探测 Kokoro 服务是否在运行
fetch(KOKORO_URL + '/health').then(r => r.json()).then(d => {
  kokoroOk = !!d.ok;
  updateTtsHint();
}).catch(() => { kokoroOk = false; updateTtsHint(); });

renderHistory();

result.addEventListener('click', (e) => {
    const t = e.target.closest('.cog');
    if (t) { input.value = t.dataset.w; search(); return; }
    // 段落阅读模式：点词直接右侧面板滑出完整卡片（不再内联展开）
    const pt = e.target.closest('.ptok');
    if (pt) {
      openPanel(pt.dataset.w);
      return;
    }
  });
// 面板事件：关闭、遮罩点击关闭、同根词跳转、收藏
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('panel-mask').addEventListener('click', closePanel);
document.getElementById('panel-body').addEventListener('click', (e) => {
    const cog = e.target.closest('.cog');
    if (cog) { openPanel(cog.dataset.w); return; }
  });
// Tab 切换
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
posTabInd();  // 初始化指示条位置
window.addEventListener('resize', posTabInd);
// 收藏/历史事件委托
document.addEventListener('click', (e) => {
  // 发音按钮：data-w=单词，data-text=整段
  const tb = e.target.closest('.tts-btn');
  if (tb) {
    const txt = tb.dataset.w || tb.dataset.text;
    if (txt) {
      speakText(txt);
      tb.classList.add('playing');
      setTimeout(() => tb.classList.remove('playing'), 800);
    }
    return;
  }
  const fb = e.target.closest('.fav-btn');
  if (fb) {
    const on = toggleFav(fb.dataset.fav);
    fb.classList.toggle('on', on);
    fb.textContent = on ? '★ 已收藏' : '☆ 收藏';
    return;
  }
  const dl = e.target.closest('.fav-rm');
  if (dl) {
    saveFavs(loadFavs().filter(x => x !== dl.dataset.del));
    renderFavs();
    return;
  }
  const hi = e.target.closest('.h-item[data-word]');
  if (hi && !e.target.closest('.fav-rm')) {
    input.value = hi.dataset.word;
    switchTab('query');
    search();
  }
  const fc = e.target.closest('#fav-clear');
  if (fc) { saveFavs([]); renderFavs(); }
});
btn.addEventListener('click', search);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
/* 拖拽搜索：从外部把词拖进输入框 → 直接替换内容（默认行为是插入，需拦截） */
input.addEventListener('dragover', (e) => { e.preventDefault(); input.classList.add('drag-over'); });
input.addEventListener('dragleave', () => input.classList.remove('drag-over'));
input.addEventListener('drop', (e) => {
  e.preventDefault();
  input.classList.remove('drag-over');
  const txt = (e.dataTransfer.getData('text') || '').trim();
  if (txt) input.value = txt;
});
</script>
</body>
</html>
