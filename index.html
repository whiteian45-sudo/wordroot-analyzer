// 从分析结果里抽出一行摘要，方便扫一眼复习
function historySummary(r) {
  if (r.source === 'enhanced' && r.enhanced) {
    const e = r.enhanced;
    let s = (e.meaning || '').split('\n')[0].trim() || '';
    if (e.breakdown) s = (e.breakdown.split('\n')[0].trim() + ' · ' + s).replace(/^· /, '');
    return s;
  }
  if (r.source === 'oxford' && r.oxford) {
    const o = r.oxford;
    return ((o.pos || '') + ' ' + (o.def_zh || '').split('\n')[0].trim()).trim() || '';
  }
  const b = r.breakdown;
  if (b) {
    const parts = [];
    if (b.prefix) parts.push(b.prefix.m + '(' + b.prefix.meaning + ')');
    (b.roots || []).forEach(r0 => parts.push(r0.m + '(' + r0.meaning + ')'));
    (b.suffixes || []).forEach(s0 => parts.push('-' + s0.m + '(' + s0.meaning + ')'));
    if (r.source === 'builtin') return '词根 · ' + b.roots[0].meaning;
    return parts.join(' + ');
  }
  if (r.ecdict) return (r.ecdict.t || '').split('\n')[0].trim() || '';
  return '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 解码 HTML 实体：数据里存的是 &amp;#x27; 这类，显示靠浏览器自动解码，
// 但朗读时传给 TTS 的是原始串，必须还原成真实字符（如 ' 和 "）。
function decodeEntities(s) {
  return String(s)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&#x27;/g, "'").replace(/&#39;/g, "'").replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}

let HISTORY = null;   // 历史权威：内存副本，源自本地服务读出的项目目录 history.json；null=尚未加载

// 启动时从本地服务拉全量历史（直接读项目目录下的 history.json，静默、不弹窗）
async function initHistory() {
  try {
    const d = await (await fetch('/history')).json();
    let items = (d && Array.isArray(d.items)) ? d.items : [];
    // 迁移：localStorage 里已有的旧记录与文件记录合并（同词保留最新），避免切换文件存储后丢数据
    let local = [];
    try { local = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { local = []; }
    const map = new Map();
    items.concat(local).forEach(x => { if (x && x.w && (!map.has(x.w) || (map.get(x.w).t || 0) < (x.t || 0))) map.set(x.w, x); });
    HISTORY = [...map.values()].sort((a, b) => (b.t || 0) - (a.t || 0));
    if (local.length) persistHistory(HISTORY);   // 有旧记录则顺手写回文件，完成迁移
  } catch (e) { HISTORY = null; }   // 服务未就绪时回退 localStorage
  renderHistory();
}

// 读取历史：优先内存权威（项目文件），否则 localStorage 兜底
function loadHistory() {
  if (HISTORY) return HISTORY;
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; }
}

// 变更后落盘：更新内存副本 + 缓存 localStorage + 异步写项目文件（不阻塞、不弹窗）
function persistHistory(h) {
  HISTORY = h;
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); }
  catch (e) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 1000))); } catch (e2) {} }
  fetch('/history', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ version: 1, items: h }) }).catch(() => {});
}

function saveHistory(r) {
  const h = loadHistory().filter(x => x.w !== r.word);   // 同词去重，移到最前
  h.unshift({ w: r.word, s: historySummary(r), t: Date.now() });
  persistHistory(h);
  renderHistory();
}

// 一键导出当前记录（另存一份，用于备份或换电脑迁移）
async function exportHistory() {
  const h = loadHistory();
  if (!h.length) { alert('暂无记录可导出'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), items: h }, null, 2)],
    { type: 'application/json' });
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: '查词记录-' + stamp + '.json',
        types: [{ description: '查词记录 (JSON)', accept: { 'application/json': ['.json'] } }],
      });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return;
    } catch (e) { /* 用户取消则走下方降级下载 */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '查词记录-' + stamp + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

let reviewState = null;   // 复习状态：{list:洗牌后的历史, i:当前索引, shown:是否已显示释义}
let histPage = 1;         // 历史列表当前页（每页 60 条）
function startReview() {
  const h = loadHistory().slice();   // 拷贝一份再洗牌，避免打乱权威存储顺序
  for (let i = h.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [h[i], h[j]] = [h[j], h[i]]; }
  reviewState = { list: h, i: 0, shown: false };
  renderReview();
}
// 主动回忆闪卡：先只看词，点「显示释义」才露出释义
function renderReview() {
  const el = document.getElementById('history');
  const s = reviewState;
  if (!s || !s.list.length) { renderHistory(); return; }
  const cur = s.list[s.i];
  const d = new Date(cur.t);
  const ts = (d.getMonth() + 1) + '-' + d.getDate();
  let h = '<div class="rev-head">复习 ' + (s.i + 1) + '/' + s.list.length +
    '<button class="h-btn" data-rev="quit">退出</button></div>';
  h += '<div class="review">';
  h += '<div class="rev-word"><span>' + escapeHtml(cur.w) + '</span>' +
    '<button class="tts-btn" data-text="' + escapeHtml(cur.w) + '" title="发音">🔊</button></div>';
  h += '<div class="rev-date">' + ts + '</div>';
  if (s.shown) {
    h += '<div class="rev-sum">' + escapeHtml(cur.s || '(暂无释义)') + '</div>';
    h += '<button class="rev-btn" data-rev="full">查看完整卡片</button>';
  } else {
    h += '<div class="rev-hint">先回忆这个词的意思，再点下方显示释义</div>';
    h += '<button class="rev-btn primary" data-rev="show">👁 显示释义</button>';
  }
  h += '</div>';
  h += '<div class="rev-nav">' +
    '<button class="rev-btn" data-rev="prev"' + (s.i === 0 ? ' disabled' : '') + '>‹ 上一个</button>' +
    '<button class="rev-btn" data-rev="shuffle">🔀 重洗</button>' +
    '<button class="rev-btn primary" data-rev="next">' + (s.i === s.list.length - 1 ? '完成 ✓' : '下一个 ›') + '</button>' +
    '</div>';
  el.innerHTML = h;
  el.classList.add('show');
}

function renderHistory() {
  const el = document.getElementById('history');
  let h = loadHistory();
  if (!h.length) { el.classList.remove('show'); el.innerHTML = ''; return; }

  // 分页：每页 60 条，无限存储后页面不至于过长
  const PER = 60;
  const pages = Math.max(1, Math.ceil(h.length / PER));
  if (histPage > pages) histPage = pages;
  if (histPage < 1) histPage = 1;
  const start = (histPage - 1) * PER;

  const items = h.slice(start, start + PER).map(x => {
    const d = new Date(x.t);
    const ts = (d.getMonth() + 1) + '-' + d.getDate() + ' ' +
      (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
      (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    return '<div class="h-item" data-word="' + escapeHtml(x.w) + '">' +
      '<span class="h-w">' + escapeHtml(x.w) + '</span>' +
      '<span class="h-s">' + escapeHtml(x.s) + '</span>' +
      '<span class="h-t">' + ts + '</span></div>';
  }).join('');

  const pager = pages > 1
    ? '<div class="h-pager">' +
      '<button class="pager-btn" data-page="prev"' + (histPage <= 1 ? ' disabled' : '') + '>‹ 上一页</button>' +
      '<span class="pager-info">' + histPage + ' / ' + pages + '</span>' +
      '<button class="pager-btn" data-page="next"' + (histPage >= pages ? ' disabled' : '') + '>下一页 ›</button>' +
      '</div>' : '';

  el.innerHTML = '<div class="h-head">查词记录' +
    '<span class="h-n">' + h.length + '</span>' +
    '<button class="h-btn" id="h-shuffle" title="主动回忆复习：先看词，点开才看释义">🎲 复习</button>' +
    '<button class="h-btn" id="h-export">导出</button>' +
    '<span class="h-btn" style="opacity:.55;cursor:default" title="历史自动存入项目目录 history.json">已自动存本地 ✓</span>' +
    '<button class="h-btn" id="h-clear">清空</button></div>' + items + pager;
  el.classList.add('show');
}

// 历史列表交互：点条目重新查这个词；点导出备份；点存到本地连文件；点清空删除全部
document.getElementById('history').addEventListener('click', (e) => {
  const item = e.target.closest('.h-item');
  if (item) {
    input.value = item.dataset.word;
    search();
    return;
  }
  // 复习模式（闪卡）：先于普通历史条目处理
  const rev = e.target.closest('[data-rev]');
  if (rev && reviewState) {
    const a = rev.dataset.rev;
    if (a === 'show') { reviewState.shown = true; renderReview(); }
    else if (a === 'prev') { if (reviewState.i > 0) { reviewState.i--; reviewState.shown = false; renderReview(); } }
    else if (a === 'next') { if (reviewState.i < reviewState.list.length - 1) { reviewState.i++; reviewState.shown = false; renderReview(); } else { startReview(); } }
    else if (a === 'full') { const w = reviewState.list[reviewState.i].w; switchTab('query'); input.value = w; search(); }
    else if (a === 'shuffle') { startReview(); }
    else if (a === 'quit') { reviewState = null; renderHistory(); }
    return;
  }
  // 历史分页：上一页/下一页（范围在 renderHistory 内自动钳制）
  const pg = e.target.closest('[data-page]');
  if (pg) {
    if (pg.dataset.page === 'next') histPage++;
    else if (pg.dataset.page === 'prev') histPage--;
    renderHistory();
    return;
  }
  if (e.target.id === 'h-shuffle') { startReview(); return; }
  if (e.target.id === 'h-export') { exportHistory(); return; }
  if (e.target.id === 'h-clear' && confirm('确定清空全部查词记录吗？')) {
    HISTORY = [];
    try { localStorage.removeItem(HIST_KEY); } catch (e2) {}
    fetch('/history', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: 1, items: [] }) }).catch(() => {});
    renderHistory();
  }
});

const KOKORO_URL = 'http://127.0.0.1:8757';
const KOKORO_VOICES = [
  ['af_heart', '美音·女·Heart'], ['af_bella', '美音·女·Bella'], ['af_nicole', '美音·女·Nicole'],
  ['af_aoede', '美音·女·Aoede'], ['af_kore', '美音·女·Kore'],
  ['am_adam', '美音·男·Adam'], ['am_michael', '美音·男·Michael'],
  ['bf_emma', '英音·女·Emma'], ['bf_isabella', '英音·女·Isabella'], ['bm_george', '英音·男·George']
];

let ttsKokoroVoice = localStorage.getItem('wr_tts_voice') || 'af_heart';
let ttsBuiltinLang = localStorage.getItem('wr_tts_lang') || 'en-US';
let ttsSpeed = parseFloat(localStorage.getItem('wr_tts_speed')) || 1;
let kokoroOk = false;   // TTS 服务是否可用，启动时探测

const ttsVoiceSel = document.getElementById('tts-voice');
const ttsSpeedSel = document.getElementById('tts-speed');
const ttsHint = document.getElementById('tts-hint');

// 内置浏览器语音
function speakBuiltin(text, rate) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ttsBuiltinLang;
  u.rate = rate;
  speechSynthesis.speak(u);
}

// Kokoro 高音质：请求本地 TTS 服务合成并播放
async function speakKokoro(text) {
  const r = await fetch(KOKORO_URL + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, voice: ttsKokoroVoice, speed: ttsSpeed })
  });
  if (!r.ok) throw new Error('TTS ' + r.status);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = new Audio(url);
  a.onended = () => URL.revokeObjectURL(url);
  await a.play();
}

// 统一入口：按当前引擎播放，Kokoro 失败时静默回退内置语音
function speakText(text) {
  text = decodeEntities(text);   // 还原 &#x27;/&quot; 等实体，朗读才跟原文一致
  if (ttsEngine === 'kokoro' && kokoroOk) {
    speakKokoro(text).catch(() => speakBuiltin(text, ttsSpeed));
  } else {
    speakBuiltin(text, ttsSpeed);
  }
}

function fillVoiceOptions() {
  ttsVoiceSel.innerHTML = '';
  if (ttsEngine === 'kokoro') {
    KOKORO_VOICES.forEach(([v, label]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      if (v === ttsKokoroVoice) o.selected = true;
      ttsVoiceSel.appendChild(o);
    });
  } else {
    [['en-US', '美音'], ['en-GB', '英音']].forEach(([v, label]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      if (v === ttsBuiltinLang) o.selected = true;
      ttsVoiceSel.appendChild(o);
    });
  }
}

  ttsHint.textContent = (ttsEngine === 'kokoro' && !kokoroOk)
    ? 'Kokoro 服务未启动，已回退内置语音' : '';

  exTimer = setTimeout(() => searchExamples(v), 300);
});
document.getElementById('ex-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchExamples(e.target.value.trim()); });
document.getElementById('ex-btn').addEventListener('click', () => searchExamples(document.getElementById('ex-input').value.trim()));
/* 拖拽搜索：从外部把词拖进输入框 → 直接替换内容（默认行为是插入，需拦截） */
input.addEventListener('dragover', (e) => { e.preventDefault(); input.classList.add('drag-over'); });
input.addEventListener('dragleave', () => input.classList.remove('drag-over'));
input.addEventListener('drop', (e) => {
  e.preventDefault();
  input.classList.remove('drag-over');
  const txt = (e.dataTransfer.getData('text') || '').trim();
  if (txt) {
    input.value = txt;
    search();   // 拖入即分析，无需再点"分析"
  }
});

</script>
</body>
</html>
